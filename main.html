<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue-bright: #4facfe;
            --accent-blue-dark: #004e92;
            --border-default: rgba(30, 58, 95, 0.8);
            --panel-bg: rgba(10, 25, 41, 0.9);
            --text-white: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; height: 0px; } /* Скрыты, но работают */

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); color: var(--text-white);
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover; z-index: -1;
        }

        header {
            position: fixed; top: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-default); z-index: 1000;
        }

        .header-logo { height: 32px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid var(--border-default);
            background: url('https://via.placeholder.com/40') center/cover;
            cursor: pointer;
        }

        main {
            height: 100%; overflow-y: auto; padding: 90px 20px 40px;
            display: flex; flex-direction: column; align-items: center;
        }

        .section { width: 100%; max-width: 400px; }
        h2 { font-size: 1.1rem; font-weight: 700; margin: 20px 0 15px; }

        .rating-card {
            background: var(--panel-bg); border: 1px solid var(--border-default);
            border-radius: 12px; height: 320px; overflow-y: auto; padding: 10px;
        }

        .row {
            display: flex; align-items: center; padding: 10px;
            background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 6px;
        }

        .mini-avatar { width: 30px; height: 30px; background: #1e3a5f; border-radius: 4px; margin-right: 12px; }
        .name { flex-grow: 1; font-size: 0.85rem; }
        .val { font-weight: 700; color: var(--accent-blue-bright); }

        .center-link {
            display: block; text-align: center; margin: 15px 0;
            color: var(--accent-blue-bright); font-size: 0.8rem; font-weight: 700;
            text-decoration: none; text-transform: uppercase;
        }

        .flex-header { display: flex; justify-content: space-between; align-items: center; }

        /* Синяя кнопка в стиле зеленой */
        .blue-btn {
            background: linear-gradient(to top, var(--accent-blue-bright) 0%, var(--accent-blue-dark) 100%);
            border: 1px solid var(--accent-blue-bright);
            color: #ffffff; padding: 6px 14px; border-radius: 6px;
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.7rem;
            text-transform: uppercase; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .sticker-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding: 10px 0;
        }

        .sticker {
            min-width: 110px; height: 110px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-default); border-radius: 10px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: rgba(255,255,255,0.4); text-align: center;
        }

        .sticker-promo {
            background: rgba(79, 172, 254, 0.1); border: 1px dashed var(--accent-blue-bright);
            color: var(--accent-blue-bright); padding: 10px; font-weight: 700;
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('hub_auth') !== 'true') window.location.href = 'index.html';
    </script>

    <div class="bg-grid"></div>
    <header>
        <img src="Logos/Logo.png" alt="Logo" class="header-logo">
        <div class="user-avatar"></div>
    </header>

    <main>
        <div class="section">
            <h2>Рейтинг энергии</h2>
            <div class="rating-card" id="rList"></div>
            <a href="#" class="center-link">Открыть рейтинг</a>

            <div class="flex-header">
                <h2>Те, кто в тени</h2>
                <button class="blue-btn">Добавить</button>
            </div>

            <div class="sticker-scroll">
                <div class="sticker">Sticker 1</div>
                <div class="sticker">Sticker 2</div>
                <div class="sticker">Sticker 3</div>
                <div class="sticker">Sticker 4</div>
                <div class="sticker">Sticker 5</div>
                <div class="sticker">Sticker 6</div>
                <div class="sticker">Sticker 7</div>
                <div class="sticker sticker-promo">Чтобы посмотреть все стикеры, добавь этот стикерпак.</div>
            </div>
        </div>
    </main>

    <script>
        const list = document.getElementById('rList');
        for (let i = 1; i <= 50; i++) {
            const r = document.createElement('div');
            r.className = 'row';
            r.innerHTML = `<div class="mini-avatar"></div><div class="name">Player Name ${i}</div><div class="val">000</div>`;
            list.appendChild(r);
        }
    </script>
</body>
</html>
