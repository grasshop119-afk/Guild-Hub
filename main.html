<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Main</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: rgba(79, 172, 254, 0.7);
            --accent-blue-full: #4facfe;
            --panel-bg: rgba(3, 8, 15, 0.95);
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), 
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(5, 11, 20, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            height: 30px;
            width: auto;
        }

        .settings-icon {
            width: 28px;
            height: 28px;
            opacity: 0.7;
            filter: invert(58%) sepia(87%) saturate(1914%) hue-rotate(182deg) brightness(101%) contrast(99%);
            cursor: pointer;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 20px 0 15px;
            text-align: left;
        }

        /* Секция рейтинга */
        .rating-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .rating-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #1e3a5f;
            border-radius: 4px;
            margin-right: 12px;
        }

        .player-name {
            flex-grow: 1;
            font-size: 0.9rem;
            text-align: left;
        }

        .energy-value {
            font-weight: 700;
            color: var(--accent-blue-full);
            letter-spacing: 1px;
        }

        .open-rating {
            font-size: 0.75rem;
            color: var(--accent-blue-full);
            text-decoration: none;
            display: block;
            margin-bottom: 30px;
            cursor: pointer;
        }

        /* Новости и Стикеры */
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-btn {
            background: transparent;
            border: 1px solid var(--accent-blue-full);
            color: var(--accent-blue-full);
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
        }

        .sticker-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-default) transparent;
        }

        .sticker-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .sticker-scroll::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 10px;
        }

        .sticker {
            min-width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sticker-promo {
            background: rgba(79, 172, 254, 0.15);
            border: 1px dashed var(--accent-blue-full);
            color: var(--accent-blue-full);
        }
    </style>
</head>
<body>

    <header>
        <img src="Logos/Logo.png" alt="Logo" class="header-logo">
        <img src="https://img.icons8.com/?size=100&id=9110&format=png&color=000000" alt="Settings" class="settings-icon">
    </header>

    <div class="container">
        <h2>Рейтинг энергии</h2>
        
        <div class="rating-panel" id="ratingList">
            </div>
        
        <a class="open-rating">Открыть рейтинг</a>

        <div class="news-header">
            <h2 style="margin: 0;">Те кто в тени</h2>
            <button class="add-btn">Добавить</button>
        </div>

        <div class="sticker-scroll">
            <div class="sticker">Sticker 1</div>
            <div class="sticker">Sticker 2</div>
            <div class="sticker">Sticker 3</div>
            <div class="sticker">Sticker 4</div>
            <div class="sticker">Sticker 5</div>
            <div class="sticker">Sticker 6</div>
            <div class="sticker">Sticker 7</div>
            <div class="sticker sticker-promo">Чтобы посмотреть все стикеры, добавь этот стикерпак.</div>
        </div>
    </div>

    <script>
        // Генерация 50 мест рейтинга для шоукейса
        const ratingList = document.getElementById('ratingList');
        for (let i = 1; i <= 50; i++) {
            const card = document.createElement('div');
            card.className = 'rating-card';
            card.innerHTML = `
                <div class="avatar"></div>
                <div class="player-name">Игрок #${i}</div>
                <div class="energy-value">750</div>
            `;
            ratingList.appendChild(card);
        }
    </script>
</body>
</html>
