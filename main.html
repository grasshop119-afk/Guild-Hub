<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guild Hub - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue-bright: #4facfe;
            --accent-blue-dark: #004e92;
            --border-default: rgba(30, 58, 95, 0.8);
            --panel-bg: rgba(10, 25, 41, 0.95);
            --text-white: #ffffff;
            --red: #ff5252;
            --green: #26b31e;
        }

        /* Полная блокировка масштабирования и движения */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); color: var(--text-white);
            font-family: 'Montserrat', sans-serif; overflow: hidden; position: fixed;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover; z-index: -1;
        }

        header {
            position: fixed; top: 0; width: 100%; height: 75px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-default); z-index: 1000;
        }

        .header-logo { height: 38px; }

        /* Квадратная аватарка */
        .user-avatar {
            width: 44px; height: 44px; border-radius: 6px;
            border: 2px solid var(--border-default); background: rgba(30, 58, 95, 0.4);
            background-size: cover; background-position: center; cursor: pointer;
        }

        main {
            height: 100%; overflow-y: auto; padding: 95px 20px 40px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        .section { width: 100%; max-width: 400px; }
        h2 { font-size: 1.1rem; font-weight: 700; margin: 20px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        .rating-wrapper { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-default); }
        .rating-wrapper::before, .rating-wrapper::after {
            content: ''; position: absolute; left: 0; right: 0; height: 40px; z-index: 2; pointer-events: none;
        }
        .rating-wrapper::before { top: 0; background: linear-gradient(to bottom, var(--bg-dark) 0%, transparent 100%); }
        .rating-wrapper::after { bottom: 0; background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%); }

        .rating-card { background: var(--panel-bg); height: 320px; overflow-y: auto; padding: 25px 10px; }

        .row {
            display: flex; align-items: center; padding: 10px;
            background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 6px;
        }
        .mini-avatar { width: 32px; height: 32px; background-size: cover; border-radius: 4px; margin-right: 12px; border: 1px solid var(--border-default); }
        .name { flex-grow: 1; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .val { font-weight: 700; font-size: 0.9rem; }
        .val.low { color: var(--red); }
        .val.ok { color: var(--green); }

        .rating-footer { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 15px 0 30px; }
        .center-link { color: var(--accent-blue-bright); font-size: 0.8rem; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        .energy-ico { width: 16px; height: 16px; filter: invert(65%) sepia(90%) saturate(1500%) hue-rotate(180deg); }

        /* Кнопка Поделиться (без затемнения при наведении) */
        .share-btn { 
            position: relative; background: linear-gradient(to top, var(--accent-blue-bright) 0%, var(--accent-blue-dark) 100%);
            border: 1px solid var(--accent-blue-bright); color: #ffffff; padding: 15px; border-radius: 12px;
            font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }
        .share-btn:hover, .share-btn:active, .share-btn:focus { 
            background: linear-gradient(to top, var(--accent-blue-bright) 0%, var(--accent-blue-dark) 100%) !important;
            filter: none !important; opacity: 1 !important; outline: none !important;
        }

        .sticker-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .sticker { min-width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-default); border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: rgba(255,255,255,0.4); text-align: center; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <header>
        <img src="Logos/Logo.png" alt="Logo" class="header-logo">
        <div id="playerAvatar" class="user-avatar"></div>
    </header>

    <main>
        <div class="section">
            <h2 id="guildTitle">Ежедневные купоны</h2>
            <div class="rating-wrapper">
                <div class="rating-card" id="rList">
                    <div id="loader" style="text-align: center; padding-top: 100px; color: var(--accent-blue-bright);">Подключение к swgoh.gg...</div>
                </div>
            </div>
            
            <div class="rating-footer">
                <a href="#" class="center-link">Открыть рейтинг</a>
                <img src="https://img.icons8.com/?size=100&id=zKnXEIdWnizE&format=png&color=000000" class="energy-ico">
            </div>

            <button class="share-btn" onclick="alert('Список скопирован!')">Поделиться списком</button>

            <h2 style="margin-top: 30px;">Те, кто в тени</h2>
            <div class="sticker-scroll">
                <div class="sticker">S1</div><div class="sticker">S2</div><div class="sticker">S3</div>
                <div class="sticker">S4</div><div class="sticker">S5</div>
            </div>
        </div>
    </main>

<script>
    const allyCode = localStorage.getItem('ally_code');
    const rList = document.getElementById('rList');
    const playerAvatar = document.getElementById('playerAvatar');

    if (!allyCode) window.location.href = 'index.html';

    async function loadSwgohData() {
        try {
            // Прямой запрос к API swgoh.gg
            const playerResponse = await fetch(`https://swgoh.gg/api/player/${allyCode}/`);
            const playerData = await playerResponse.json();
            
            // Определяем аватарку и имя
            const playerName = playerData.data.name;
            const pAvatarId = playerData.data.portrait_id || '1';
            playerAvatar.style.backgroundImage = `url('https://game-assets.swgoh.gg/tex.gui_portraits_${pAvatarId}.png')`;

            // Берем ID гильдии игрока
            const guildId = playerData.data.guild_id;
            const guildResponse = await fetch(`https://swgoh.gg/api/guild/${guildId}/`);
            const guildData = await guildResponse.json();

            document.getElementById('guildTitle').innerText = guildData.data.name;

            // Сортировка по ЕЖЕДНЕВНЫМ КУПОНАМ (daily_raid_tickets)
            let members = guildData.data.members;
            members.sort((a, b) => (a.daily_raid_tickets || 0) - (b.daily_raid_tickets || 0));

            rList.innerHTML = "";
            members.forEach(m => {
                const tickets = m.daily_raid_tickets || 0;
                const statusClass = tickets < 600 ? 'low' : 'ok';
                const mAvatar = `https://game-assets.swgoh.gg/tex.gui_portraits_${m.portrait_id || '1'}.png`;

                rList.innerHTML += `
                    <div class="row">
                        <div class="mini-avatar" style="background-image: url('${mAvatar}')"></div>
                        <div class="name">${m.player_name}</div>
                        <div class="val ${statusClass}">${tickets} / 600</div>
                    </div>`;
            });

        } catch (err) {
            rList.innerHTML = `<div style="text-align: center; padding: 50px 20px; color: var(--red); font-size: 0.8rem;">Ошибка загрузки. Вероятно, swgoh.gg блокирует прямой доступ из браузера (CORS).</div>`;
            console.error(err);
        }
    }

    loadSwgohData();
</script>
</body>
</html>
