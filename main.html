<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guild Hub - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue-bright: #4facfe;
            --accent-blue-dark: #004e92;
            --border-default: rgba(30, 58, 95, 0.8);
            --panel-bg: rgba(10, 25, 41, 0.95);
            --text-white: #ffffff;
            --red: #ff5252;
            --green: #26b31e;
        }

        /* Блокировка масштабирования и боковых сдвигов */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: pan-y; /* Только вертикальная прокрутка контента */
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); color: var(--text-white);
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Запрещаем двигать само окно браузера */
            position: fixed;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover; z-index: -1;
        }

        header {
            position: fixed; top: 0; width: 100%; height: 75px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-default); z-index: 1000;
        }

        .header-logo { height: 38px; }

        /* Квадратная аватарка игрока в шапке */
        .user-avatar {
            width: 44px; height: 44px; border-radius: 6px;
            border: 2px solid var(--border-default);
            background: rgba(30, 58, 95, 0.4);
            background-size: cover; background-position: center;
            cursor: pointer;
        }

        main {
            height: 100%; overflow-y: auto; padding: 95px 20px 40px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        .section { width: 100%; max-width: 400px; }
        h2 { font-size: 1.1rem; font-weight: 700; margin: 20px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* Окно рейтинга */
        .rating-wrapper { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-default); }
        .rating-wrapper::before, .rating-wrapper::after {
            content: ''; position: absolute; left: 0; right: 0; height: 40px; z-index: 2; pointer-events: none;
        }
        .rating-wrapper::before { top: 0; background: linear-gradient(to bottom, var(--bg-dark) 0%, transparent 100%); }
        .rating-wrapper::after { bottom: 0; background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%); }

        .rating-card { background: var(--panel-bg); height: 320px; overflow-y: auto; padding: 25px 10px; }

        .row {
            display: flex; align-items: center; padding: 10px;
            background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 6px;
        }
        .mini-avatar { width: 32px; height: 32px; background-size: cover; border-radius: 4px; margin-right: 12px; border: 1px solid var(--border-default); }
        .name { flex-grow: 1; font-size: 0.85rem; }
        .val { font-weight: 700; font-size: 0.9rem; }
        .val.low { color: var(--red); }
        .val.ok { color: var(--green); }

        /* Футер рейтинга с иконкой молнии */
        .rating-footer { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 15px 0 30px; }
        .center-link { color: var(--accent-blue-bright); font-size: 0.8rem; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        .energy-ico { width: 16px; height: 16px; filter: invert(65%) sepia(90%) saturate(1500%) hue-rotate(180deg); }

        /* Синяя кнопка со свечением */
        .blue-btn {
            position: relative; background: linear-gradient(to top, var(--accent-blue-bright) 0%, var(--accent-blue-dark) 100%);
            border: 1px solid var(--accent-blue-bright); color: #ffffff; padding: 8px 16px; border-radius: 6px;
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .glow-line { position: absolute; bottom: -1px; left: 50%; width: 80%; height: 2px; background: radial-gradient(circle, #ffffff 0%, #ffffff 30%, transparent 80%); transform: translateX(-50%); opacity: 0; transition: opacity 0.2s; }
        .blue-btn:hover .glow-line { opacity: 1; }

        /* Компактные стикеры */
        .sticker-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .sticker { min-width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-default); border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: rgba(255,255,255,0.4); text-align: center; }
        .sticker-promo { background: rgba(79, 172, 254, 0.1); border: 1px dashed var(--accent-blue-bright); color: var(--accent-blue-bright); font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <header>
        <img src="Logos/Logo.png" alt="Logo" class="header-logo">
        <div id="playerAvatar" class="user-avatar"></div>
    </header>

    <main>
        <div class="section">
            <h2 id="guildTitle">Рейтинг энергии</h2>
            <div class="rating-wrapper">
                <div class="rating-card" id="rList">
                    <div style="text-align: center; padding-top: 100px; color: var(--accent-blue-bright);">Загрузка гильдии...</div>
                </div>
            </div>
            
            <div class="rating-footer">
                <a href="#" class="center-link">Открыть рейтинг</a>
                <img src="https://img.icons8.com/?size=100&id=zKnXEIdWnizE&format=png&color=000000" class="energy-ico">
            </div>

            <div class="flex-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0;">Те, кто в тени</h2>
                <button class="blue-btn">Добавить<div class="glow-line"></div></button>
            </div>

            <div class="sticker-scroll">
                <div class="sticker">Sticker 1</div><div class="sticker">Sticker 2</div><div class="sticker">Sticker 3</div>
                <div class="sticker">Sticker 4</div><div class="sticker">Sticker 5</div><div class="sticker">Sticker 6</div>
                <div class="sticker">Sticker 7</div><div class="sticker sticker-promo">Больше</div>
            </div>
        </div>
    </main>

<script>
    const allyCode = localStorage.getItem('ally_code');
    const rList = document.getElementById('rList');
    const playerAvatar = document.getElementById('playerAvatar');

    if (localStorage.getItem('hub_auth') !== 'true' || !allyCode) {
        window.location.href = 'index.html';
    }

    async function fetchGuildData() {
        try {
            // Запрос к твоему API (API должен отдавать JSON с именами, кодами и билетами)
            const response = await fetch(`/api/guild/${allyCode}`);
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            document.getElementById('guildTitle').innerText = data.name || "Твоя Гильдия";

            let members = data.members;
            // Сортируем по возрастанию билетов (должники сверху)
            members.sort((a, b) => (a.daily_raid_tickets || 0) - (b.daily_raid_tickets || 0));

            rList.innerHTML = "";
            members.forEach(m => {
                const t = m.daily_raid_tickets ?? 0;
                const statusClass = t < 600 ? 'low' : 'ok';
                // Ссылка на ассеты аватаров swgoh.gg
                const avatarImg = m.portrait_id ? `https://game-assets.swgoh.gg/tex.gui_portraits_${m.portrait_id}.png` : 'https://via.placeholder.com/32';

                rList.innerHTML += `
                    <div class="row">
                        <div class="mini-avatar" style="background-image: url('${avatarImg}')"></div>
                        <div class="name">${m.player_name}</div>
                        <div class="val ${statusClass}">${t}</div>
                    </div>`;
                
                // Ставим аватар текущего авторизованного игрока в шапку
                if (m.ally_code == allyCode) {
                    playerAvatar.style.backgroundImage = `url('${avatarImg}')`;
                }
            });

        } catch (err) {
            rList.innerHTML = `<div style="text-align: center; padding-top: 100px; color: var(--red); font-size: 0.8rem;">Ошибка: ${err.message}</div>`;
        }
    }

    fetchGuildData();
</script>
</body>
</html>
