<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14; --accent-blue: #4facfe; --swgoh-green: #26b31e;
            --text-white: #ffffff; --gear-gold: #f8b700; --gear-purple: #bc63ff; --gear-red: #ff4d4d;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Roboto', sans-serif; background: var(--bg-dark); color: var(--text-white);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 60px;
        }
        .main-ui { text-align: center; width: 90%; max-width: 360px; margin-top: 40px; }
        .logo { width: 180px; margin-bottom: 25px; }
        .interactive-area { position: relative; width: 100%; height: 75px; margin-bottom: 20px; }
        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(79,172,254,0.3); border-radius: 8px; position: absolute; top: 0; left: 0;
        }
        .swgoh-input { padding: 0 15px; color: #fff; font-size: 1.2rem; outline: none; text-align: center; letter-spacing: 3px; }
        .status-plate { display: none; align-items: center; padding: 0 12px; background: #0a1626; z-index: 5; }
        .avatar-box { width: 50px; height: 50px; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--accent-blue); overflow: hidden; }
        .avatar { width: 100%; height: 100%; object-fit: cover; }
        .info { flex-grow: 1; text-align: left; padding: 0 12px; overflow: hidden; }
        .info b { display: block; color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; }
        .info span { font-size: 0.75rem; opacity: 0.7; display: block; }
        .submit-btn {
            width: 100%; padding: 18px; font-family: 'Montserrat'; font-weight: 700;
            text-transform: uppercase; color: rgba(255,255,255,0.3); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); transition: 0.3s;
        }
        .submit-btn.active { background: linear-gradient(to top, var(--swgoh-green), #0f400b); border: 1px solid #45f53d; color: #fff; cursor: pointer; }
        .submit-btn.active:hover { opacity: 1 !important; filter: none !important; }
        .section-header { width: 90%; max-width: 1000px; margin: 40px 0 15px; color: var(--accent-blue); border-left: 4px solid var(--accent-blue); padding-left: 12px; display: none; font-family: 'Montserrat'; }
        .grid-container { width: 95%; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 15px; display: none; }
        .card { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .unit-portrait { position: relative; width: 68px; height: 68px; margin: 0 auto 10px; }
        .unit-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #3d444d; background: #1a1a1a; }
        .relic-tag { position: absolute; bottom: -2px; right: -2px; background: var(--gear-red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; border: 1px solid white; }
        .name-label { font-size: 0.75rem; font-weight: 700; height: 2.6em; overflow: hidden; margin-bottom: 6px; }
        .stars-row { color: var(--gear-gold); font-size: 0.65rem; margin-bottom: 5px; }
        .stats-label { font-size: 0.8rem; font-weight: 800; }
        .reset-btn { cursor: pointer; filter: invert(1); width: 18px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="main-ui">
    <img src="Logos/Logo.png" class="logo" onerror="this.style.display='none'">
    <div class="interactive-area">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
        <div id="statusPlate" class="status-plate">
            <div id="avatarBox" class="avatar-box"></div>
            <div class="info">
                <b id="pName"></b>
                <span id="pDesc"></span>
                <span id="pGuild" style="color:var(--swgoh-green)"></span>
            </div>
            <img src="https://img.icons8.com/?size=100&id=95867&format=png" class="reset-btn" id="resetBtn">
        </div>
    </div>
    <button id="submitBtn" class="submit-btn" disabled>Продолжить</button>
</div>

<div id="charsTitle" class="section-header">ПЕРСОНАЖИ</div>
<div id="charsGrid" class="grid-container"></div>
<div id="shipsTitle" class="section-header">ФЛОТ</div>
<div id="shipsGrid" class="grid-container"></div>

<script>
    const WORKER_URL = 'https://swgoh-auth.grasshop119.workers.dev/'; // ТВОЙ ВОРКЕР
    const input = document.getElementById('allyCode');
    const plate = document.getElementById('statusPlate');
    const submitBtn = document.getElementById('submitBtn');

    // Функция для проксирования картинок через воркер (чтобы не было CORS ошибок на iOS)
    const getProxyImg = (originalUrl) => `${WORKER_URL}?url=${encodeURIComponent(originalUrl)}`;

    input.oninput = (e) => {
        let val = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = val.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3');
        if (val.length === 9) performSearch(val);
    };

    async function performSearch(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        
        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(api)}`);
            const json = await res.json();
            const p = json.data || json;

            // Рендер шапки
            const portraitUrl = p.portrait_image || `https://game-assets.swgoh.gg/tex.charui_bossk.png`;
            document.getElementById('avatarBox').innerHTML = `<img src="${getProxyImg(portraitUrl)}" class="avatar">`;
            document.getElementById('pName').innerText = p.name;
            document.getElementById('pDesc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M`;
            document.getElementById('pGuild').innerText = p.guild_name || "No Guild";

            renderInventory(json.units);
            submitBtn.classList.add('active');
            submitBtn.disabled = false;
        } catch (e) {
            alert("Ошибка загрузки. Проверь код.");
            location.reload();
        }
    }

    function renderInventory(units) {
        const build = (list, isShip) => list.map(u => {
            const d = u.data;
            const relic = d.relic_tier > 2 ? d.relic_tier - 2 : null;
            // Берем поле d.image прямо из твоего файла
            const imgUrl = `https://game-assets.swgoh.gg/tex.${d.image}.png`;
            
            let gearCol = 'var(--accent-blue)';
            if (d.gear_level >= 13) gearCol = 'var(--gear-red)';
            else if (d.gear_level >= 12) gearCol = 'var(--gear-gold)';

            return `
                <div class="card">
                    <div class="unit-portrait">
                        <img class="unit-img" src="${getProxyImg(imgUrl)}" onerror="this.src='https://game-assets.swgoh.gg/tex.charui_unknown.png'">
                        ${relic ? `<div class="relic-tag">R${relic}</div>` : ''}
                    </div>
                    <div class="name-label">${d.name}</div>
                    <div class="stars-row">${'★'.repeat(d.star_level)}</div>
                    <div class="stats-label" style="color:${gearCol}">
                        ${isShip ? (d.power/1000).toFixed(1)+'k' : 'Gear '+d.gear_level}
                    </div>
                </div>`;
        }).join('');

        const chars = units.filter(u => u.data.combat_type === 1).sort((a,b) => b.data.power - a.data.power);
        const ships = units.filter(u => u.data.combat_type === 2).sort((a,b) => b.data.power - a.data.power);

        if (chars.length) {
            document.getElementById('charsTitle').style.display = 'block';
            document.getElementById('charsGrid').style.display = 'grid';
            document.getElementById('charsGrid').innerHTML = build(chars, false);
        }
        if (ships.length) {
            document.getElementById('shipsTitle').style.display = 'block';
            document.getElementById('shipsGrid').style.display = 'grid';
            document.getElementById('shipsGrid').innerHTML = build(ships, true);
        }
    }

    document.getElementById('resetBtn').onclick = () => location.reload();
</script>
</body>
</html>
