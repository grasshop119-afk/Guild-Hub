<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new window.VConsole();</script>

    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; z-index: 10; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        h1 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; opacity: 0.9; }

        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 50px 0 18px; color: #ffffff;
            font-size: 1.2rem; outline: none; text-align: center; letter-spacing: 3px;
        }

        .paste-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; fill: rgba(255, 255, 255, 0.4); z-index: 10; padding: 5px; }

        .status-plate { display: none; align-items: center; padding: 0 15px; z-index: 5; }
        .loader-box { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; }
        .player-portrait { width: 100%; height: 100%; object-fit: cover; }

        .swgoh-spinner { width: 20px; height: 20px; border: 2px solid rgba(79, 172, 254, 0.1); border-top: 2px solid var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-info-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px; align-items: center; text-align: center; }
        .status-info-wrapper.align-left { align-items: flex-start; text-align: left; }
        
        .player-rank-title { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; }
        .player-name-success { color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .player-gp-sub { font-size: 0.75rem; color: rgba(255,255,255,0.5); }

        .reset-icon { width: 24px; height: 24px; cursor: pointer; filter: invert(1); opacity: 0.6; }

        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); cursor: not-allowed; transition: 0.3s;
        }

        .submit-btn.active { background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark)); color: #fff; cursor: pointer; border: 1px solid #45f53d; }

        .disclaimer-bar { position: fixed; bottom: -300px; left: 0; width: 100%; background: #fff; color: #000; padding: 15px; transition: 0.6s; z-index: 1000; }
        .disclaimer-bar.active { bottom: 0; }

        .credits { font-size: 0.7rem; margin-top: 20px; color: rgba(255,255,255,0.4); }
        .credits a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

<div id="disclaimer" class="disclaimer-bar">
    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:0.8rem; margin-bottom:5px;">
        <span>ОТКАЗ ОТ ОТВЕТСТВЕННОСТИ</span>
        <span id="closeDisclaimer" style="cursor:pointer; font-size:1.2rem;">×</span>
    </div>
    <div style="font-size:0.7rem;">Мы не несем ответственности за данные. <a href="Decline.txt">Подробнее</a></div>
</div>

<div class="main-content">
    <img src="Logos/Logo.png" class="logo" onerror="this.style.display='none'">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введите <b>код союзника</b></p>

    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
            <div class="paste-icon" id="pasteBtn">📋</div>
        </div>

        <div id="statusPlate" class="status-plate">
            <div id="statusVisual" class="loader-box"><div class="swgoh-spinner"></div></div>
            <div id="infoWrapper" class="status-info-wrapper">
                <span id="playerRank" class="player-rank-title"></span>
                <span id="statusText" class="player-name-success">Загрузка...</span>
                <span id="subText" class="player-gp-sub"></span>
            </div>
            <div id="resetBtn" class="reset-icon">✕</div>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
    <div class="credits">Created for <b>Те, кто в тени</b>. <br> By <a href="https://t.me/tz_projects">@tz_projects</a></div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const inputContainer = document.getElementById('inputContainer');
    const statusPlate = document.getElementById('statusPlate');
    const statusText = document.getElementById('statusText');
    const playerRank = document.getElementById('playerRank');
    const statusVisual = document.getElementById('statusVisual');
    const infoWrapper = document.getElementById('infoWrapper');
    const subText = document.getElementById('subText');
    const btn = document.getElementById('submitBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const resetBtn = document.getElementById('resetBtn');
    const disclaimer = document.getElementById('disclaimer');
    const closeDisclaimer = document.getElementById('closeDisclaimer');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    window.addEventListener('load', () => {
        setTimeout(() => disclaimer.classList.add('active'), 1000);
    });

    async function startSearch() {
        const pureDigits = input.value.replace(/\D/g, '');
        if (pureDigits.length !== 9) return;

        inputContainer.style.display = 'none';
        statusPlate.style.display = 'flex';
        infoWrapper.classList.remove('align-left');
        statusText.innerText = 'Загрузка...';

        try {
            // ЧИСТЫЙ ПУТЬ БЕЗ ТОЧЕК
            const response = await fetch('/api/player/' + pureDigits, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) throw new Error("Код не найден");

            const p = await response.json();

            if (p && p.name) {
                statusVisual.innerHTML = `<img src="${p.portrait_image || ''}" class="player-portrait" onerror="this.src='Logos/NoShield.png'">`;
                infoWrapper.classList.add('align-left');
                statusText.innerText = p.name;
                playerRank.innerText = p.title || "ИГРОК";
                subText.innerText = `${(p.galactic_power / 1000000).toFixed(2)}M GP`;
                btn.classList.add('active');
            } else {
                throw new Error("Ошибка данных");
            }
        } catch (e) {
            console.error(e);
            statusVisual.innerHTML = '❌';
            statusText.innerText = "Ошибка";
            subText.innerText = "Попробуйте снова";
        }
    }

    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        if (input.value.replace(/\D/g, '').length === 9) startSearch();
    });

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = formatValue(text);
            if (input.value.replace(/\D/g, '').length === 9) startSearch();
        } catch (err) { input.focus(); }
    });

    resetBtn.addEventListener('click', () => {
        statusPlate.style.display = 'none';
        inputContainer.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
    });

    closeDisclaimer.addEventListener('click', () => disclaimer.classList.remove('active'));
</script>
</body>
</html>
