<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover; background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        h1 { font-size: 1.3rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: 0.85rem; margin-bottom: 25px; opacity: 0.8; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .swgoh-input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px 50px 18px 18px; color: #ffffff;
            font-family: 'Montserrat', sans-serif; font-size: 1.1rem;
            outline: none; text-align: center; letter-spacing: 3px;
        }

        .paste-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; fill: rgba(255, 255, 255, 0.4); padding: 8px; }

        .guild-preview {
            display: none; background: rgba(30, 58, 95, 0.2); border: 1px solid var(--border-default);
            border-radius: 8px; margin-bottom: 20px; padding: 12px 14px; align-items: center; text-align: left;
        }

        .guild-icon-box { width: 40px; height: 40px; background: rgba(0, 0, 0, 0.3); border-radius: 6px; margin-right: 12px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .guild-icon-img { width: 100%; height: 100%; object-fit: cover; }
        
        .guild-name-display { font-weight: 700; font-size: 0.9rem; color: var(--accent-blue); display: block; }
        .guild-sub-text { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

        .submit-btn {
            position: relative; width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: 0.3s; letter-spacing: 2px;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }

        /* Кнопка Share из твоих правил: не темнеет */
        .share-btn {
            background: #3390ec; color: white; border: none; padding: 12px; 
            border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px;
        }
        .share-btn:hover, .share-btn:active { background: #3390ec !important; opacity: 1 !important; filter: none !important; }

        .tg-login { font-size: 0.8rem; margin-top: 20px; opacity: 0.6; }
        .tg-login a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" alt="Logo" class="logo" onerror="this.src='https://game-assets.swgoh.gg/tex.guild_avatar_mon_calamari_01.png'">
    <h1>Guild Hub</h1>
    <p class="description">Введи <b>код союзника</b></p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
        <div class="paste-icon" id="pasteBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
        </div>
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon-box">
            <img id="guildImg" class="guild-icon-img" src="https://game-assets.swgoh.gg/tex.guild_avatar_mon_calamari_01.png">
        </div>
        <div class="guild-info-wrapper">
            <span id="guildNameDisplay" class="guild-name-display">Загрузка...</span>
            <span id="guildSubText" class="guild-sub-text">Ищем игрока</span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
    
    <button class="share-btn" id="shareBtn">ПОДЕЛИТЬСЯ</button>

    <div class="tg-login">Есть аккаунт? <a href="#">Войти с Telegram</a></div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const preview = document.getElementById('guildPreview');
    const gName = document.getElementById('guildNameDisplay');
    const gSub = document.getElementById('guildSubText');

    function format(v) {
        let d = v.replace(/\D/g, '').substring(0, 9);
        let f = "";
        for (let i = 0; i < d.length; i++) {
            if (i > 0 && i % 3 === 0) f += "-";
            f += d[i];
        }
        return f;
    }

    async function checkPlayer(code) {
        preview.style.display = 'flex';
        gName.innerText = 'Синхронизация...';
        btn.classList.remove('active');
        
        try {
            const r = await fetch(`/api/player/${code.replace(/-/g, '')}`);
            const j = await r.json();
            
            if (j.success) {
                gName.innerText = j.data.guild_name;
                gSub.innerText = `Игрок: ${j.data.name}`;
                btn.classList.add('active');
            } else {
                gName.innerText = "Не найден в gg";
                gSub.innerText = "Игрок не синхронизирован";
            }
        } catch (e) {
            gName.innerText = "Ошибка сети";
        }
    }

    input.addEventListener('input', () => {
        input.value = format(input.value);
        if (input.value.replace(/\D/g, '').length === 9) checkPlayer(input.value);
        else preview.style.display = 'none';
    });

    document.getElementById('pasteBtn').addEventListener('click', async () => {
        const t = await navigator.clipboard.readText();
        input.value = format(t);
        input.dispatchEvent(new Event('input'));
    });

    btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
            localStorage.setItem('ally_code', input.value);
            window.location.href = 'main.html';
        }
    });

    document.getElementById('shareBtn').addEventListener('click', () => alert('Ссылка скопирована!'));
</script>
</body>
</html>
