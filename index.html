<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            outline: none; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; z-index: 10; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        h1 { font-size: clamp(1.2rem, 5vw, 1.4rem); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: clamp(0.8rem, 3.5vw, 0.9rem); font-weight: 400; margin-bottom: 25px; opacity: 0.9; }

        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
            transition: all 0.3s ease;
        }

        .swgoh-input {
            padding: 0 50px 0 18px; color: #ffffff;
            font-family: 'Montserrat', sans-serif; font-size: clamp(1.1rem, 4vw, 1.2rem);
            outline: none; text-align: center; letter-spacing: 3px; font-weight: 400;
        }

        .paste-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; fill: rgba(255, 255, 255, 0.4); display: flex; align-items: center; padding: 8px; z-index: 10;
        }

        .status-plate { display: none; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 5; }
        .loader-box { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .swgoh-spinner {
            width: 22px; height: 22px; border: 2px solid rgba(79, 172, 254, 0.1);
            border-top: 2px solid var(--accent-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .guild-icon-img { width: 32px; height: 32px; object-fit: contain; }
        .guild-icon-img.default-shield { opacity: 0.75; }

        .status-info-wrapper {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; padding: 0 10px;
        }
        
        .status-text { 
            font-weight: 400; font-size: 0.9rem; color: #ffffff; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; text-align: center;
        }
        .guild-name-success { color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; font-size: 0.95rem; font-weight: 700; }
        .members-count { font-size: 0.75rem; color: rgba(255,255,255,0.5); font-weight: 400; margin-top: 2px; }

        .reset-icon {
            width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0.6; transition: opacity 0.2s; flex-shrink: 0;
            filter: invert(47%) sepia(17%) saturate(1295%) hue-rotate(174deg) brightness(95%) contrast(92%);
        }
        .reset-icon:hover { opacity: 1; }
        .reset-icon img { width: 20px; height: 20px; }

        .submit-btn {
            position: relative; width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; letter-spacing: 2px;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%) !important;
            border: 1px solid #45f53d !important; color: #ffffff !important; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
            opacity: 1 !important;
        }

        /* ПРАВИЛО: Кнопка не темнеет при фокусе/нажатии */
        .submit-btn.active:active, 
        .submit-btn.active:focus,
        .submit-btn.active:hover {
            filter: brightness(1) !important;
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%) !important;
            transform: translateY(-1px);
        }

        .credits { font-size: 0.85rem; margin-top: 25px; color: rgba(255,255,255,0.4); font-weight: 400; }
        .credits a { color: var(--accent-blue); text-decoration: none; font-weight: 400; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой код союзника для авторизации.</p>

    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
            <div class="paste-icon" id="pasteBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
            </div>
        </div>

        <div id="statusPlate" class="status-plate">
            <div id="statusVisual" class="loader-box">
                <div class="swgoh-spinner"></div>
            </div>
            
            <div class="status-info-wrapper">
                <span id="statusText" class="status-text">Загрузка...</span>
                <span id="membersCount" class="members-count"></span>
            </div>

            <div class="reset-icon" id="resetBtn">
                <img src="https://img.icons8.com/?size=100&id=95867&format=png&color=000000" alt="reset">
            </div>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>

    <div class="credits">
        Создано <a href="https://t.me/tz_projects" target="_blank">@tz_projects</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const inputContainer = document.getElementById('inputContainer');
    const statusPlate = document.getElementById('statusPlate');
    const statusText = document.getElementById('statusText');
    const statusVisual = document.getElementById('statusVisual');
    const membersCount = document.getElementById('membersCount');
    const btn = document.getElementById('submitBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Ссылка на твой личный прокси-воркер в Cloudflare
    const PROXY_URL = "https://swgoh-auth.grasshop119.workers.dev/?url=";

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    function resetUI() {
        statusPlate.style.display = 'none';
        inputContainer.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
        statusText.classList.remove('guild-name-success');
        membersCount.innerText = '';
        setTimeout(() => input.focus(), 100);
    }

    async function fetchData(allyCode) {
        try {
            const apiTarget = `https://swgoh.gg/api/player/${allyCode}/`;
            // Запрос идет через твой Cloudflare Worker
            const response = await fetch(PROXY_URL + encodeURIComponent(apiTarget));
            const json = await response.json();
            
            // Обработка данных из формата твоего fiz.json
            const pData = json.data || json;
            
            if (pData && pData.name) {
                renderSuccess(pData);
            } else {
                showError("Игрок не найден");
            }
        } catch (e) {
            console.error(e);
            showError("Ошибка сети");
        }
    }

    function renderSuccess(pData) {
        const guildName = pData.guild_name || "Без гильдии";
        // Извлекаем ГМ из JSON
        const gp = (pData.galactic_power / 1000000).toFixed(2);
        
        statusText.innerText = guildName;
        statusText.classList.add('guild-name-success');
        
        // Показываем ГМ игрока и его имя
        membersCount.innerText = `Твой ГМ: ${gp}M • Игрок: ${pData.name}`;
        
        // Меняем иконку гильдии (если это твоя гильдия)
        let shieldImg = "NoShield.png";
        let shieldClass = "guild-icon-img default-shield";
        
        if (guildName === "Those who are in the shadows") {
            shieldImg = "ShadeShield.png";
            shieldClass = "guild-icon-img";
        }

        statusVisual.innerHTML = `<img class="${shieldClass}" src="Logos/${shieldImg}" onerror="this.src='https://img.icons8.com/ios-filled/50/4facfe/shield.png'">`;
        
        // Активируем кнопку
        btn.classList.add('active');
    }

    function showError(msg) {
        statusVisual.innerHTML = '❌';
        statusText.innerText = msg;
        statusText.classList.remove('guild-name-success');
        membersCount.innerText = 'Проверь код союза';
        btn.classList.remove('active');
    }

    // События ввода
    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        const pureDigits = input.value.replace(/\D/g, '');
        if (pureDigits.length === 9) {
            inputContainer.style.display = 'none';
            statusPlate.style.display = 'flex';
            statusText.innerText = 'Синхронизация...';
            statusVisual.innerHTML = '<div class="swgoh-spinner"></div>';
            fetchData(pureDigits);
        }
    });

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = formatValue(text);
            const pureDigits = input.value.replace(/\D/g, '');
            if (pureDigits.length === 9) {
                inputContainer.style.display = 'none';
                statusPlate.style.display = 'flex';
                fetchData(pureDigits);
            }
        } catch (err) {
            input.focus();
        }
    });

    resetBtn.addEventListener('click', resetUI);

    // Автофокус для десктопа
    window.addEventListener('load', () => {
        if (window.innerWidth > 1024) input.focus();
    });
</script>
</body>
</html>
