<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWGOH SCANNER</title>
    <style>
        /* Основные стили */
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0a0a0a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h2 { color: #edb219; letter-spacing: 2px; margin-bottom: 25px; }

        /* Поле ввода и кнопка поиска */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        input { 
            padding: 16px; border-radius: 12px; border: 1px solid #333; 
            background: #1a1a1a; color: white; font-size: 18px;
            box-sizing: border-box; outline: none; text-align: center;
        }

        button#search-btn { 
            padding: 16px; border-radius: 12px; border: none; 
            background: #007bff; color: white; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }

        /* Карточка игрока */
        #player-card { 
            display: none; width: 100%; box-sizing: border-box;
            background: #151515; border-radius: 24px; padding: 30px; 
            margin-top: 30px; border: 1px solid #222; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .avatar-frame {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .avatar { 
            width: 120px; height: 120px; border-radius: 50%; 
            border: 4px solid #edb219; object-fit: cover;
            background: #000;
        }

        .level-badge {
            position: absolute; bottom: 0; right: 0;
            background: #edb219; color: black; font-weight: bold;
            padding: 4px 8px; border-radius: 8px; font-size: 14px;
        }

        .player-name { font-size: 26px; font-weight: 800; margin: 10px 0 5px 0; }
        .player-title { color: #888; font-size: 14px; font-style: italic; margin-bottom: 20px; display: block; }

        .gm-box {
            background: rgba(237, 178, 25, 0.1);
            padding: 15px; border-radius: 15px; margin-bottom: 20px;
            border: 1px solid rgba(237, 178, 25, 0.2);
        }

        .gm-label { font-size: 12px; color: #edb219; text-transform: uppercase; letter-spacing: 1px; }
        .gm-value { font-size: 22px; font-weight: bold; color: #fff; display: block; }

        .guild-info {
            background: rgba(77, 184, 255, 0.05);
            padding: 15px; border-radius: 15px;
            border: 1px solid rgba(77, 184, 255, 0.1);
        }

        .guild-name { color: #4db8ff; font-size: 18px; font-weight: bold; display: block; }
        .guild-role { color: #666; font-size: 13px; margin-top: 4px; display: block; }

        /* Кнопка Поделиться - не темнеет при наведении */
        .share-btn { 
            background: #28a745 !important; 
            width: 100%; margin-top: 25px; padding: 16px; 
            border: none; border-radius: 12px; 
            color: white; font-weight: bold; font-size: 16px;
            cursor: pointer;
        }
        .share-btn:hover { background: #28a745 !important; opacity: 0.9; }

        #status-msg { margin-top: 20px; font-size: 14px; color: #666; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SWGOH SCANNER</h2>
        
        <div class="search-box">
            <input type="tel" id="allyCode" placeholder="Код (9 цифр)" maxlength="9">
            <button id="search-btn" onclick="fetchData()">АНАЛИЗИРОВАТЬ</button>
        </div>

        <div id="status-msg"></div>

        <div id="player-card">
            <div class="avatar-frame">
                <img id="p-avatar" class="avatar" src="" alt="">
                <div id="p-level" class="level-badge"></div>
            </div>

            <div class="player-name" id="p-name"></div>
            <span class="player-title" id="p-title"></span>

            <div class="gm-box">
                <span class="gm-label">Галактическая мощь</span>
                <span class="gm-value" id="p-gm"></span>
            </div>

            <div class="guild-info">
                <span class="guild-name" id="g-name"></span>
                <span class="guild-role" id="g-role"></span>
            </div>

            <button class="share-btn">ПОДЕЛИТЬСЯ</button>
        </div>
    </div>

    <script>
        async function fetchData() {
            const input = document.getElementById('allyCode').value;
            const code = input.replace(/\D/g, ''); // Оставляем только цифры
            const status = document.getElementById('status-msg');
            const card = document.getElementById('player-card');

            if (code.length < 9) {
                alert('Код должен состоять из 9 цифр');
                return;
            }

            // Очистка перед новым запросом
            status.style.color = "#666";
            status.textContent = "🔍 Связь с Голонетом...";
            card.style.display = 'none';

            // Используем corsproxy.io — самый стабильный для мобильных Pages
            const targetUrl = `https://swgoh.gg/api/player/${code}/`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error(`Ошибка: ${response.status}. Игрок не найден.`);
                }

                const result = await response.json();
                
                // В структуре fiz.json данные лежат в объекте .data
                const p = result.data;

                if (!p || !p.name) {
                    throw new Error("Данные игрока повреждены");
                }

                // Заполнение элементов
                document.getElementById('p-avatar').src = `https://game-assets.swgoh.gg/tex.charui_portrait_${p.portrait_id}.png`;
                document.getElementById('p-name').textContent = p.name;
                document.getElementById('p-level').textContent = p.level;
                document.getElementById('p-title').textContent = p.title || 'Ветеран';
                document.getElementById('p-gm').textContent = p.galactic_power.toLocaleString();
                document.getElementById('g-name').textContent = p.guild_name || 'Без гильдии';
                document.getElementById('g-role').textContent = getRoleLabel(p.guild_member_level);

                // Показываем карточку
                card.style.display = 'block';
                status.textContent = "";

            } catch (err) {
                console.error(err);
                status.style.color = "#ff4d4d";
                status.textContent = "❌ " + err.message;
            }
        }

        function getRoleLabel(level) {
            const roles = {
                4: 'Лидер гильдии',
                3: 'Офицер',
                2: 'Участник'
            };
            return roles[level] || 'Гость';
        }

        // Обработка нажатия Enter
        document.getElementById('allyCode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchData();
            }
        });
    </script>
</body>
</html>
