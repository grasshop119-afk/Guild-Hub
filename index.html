<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green: #26b31e;
            --text-white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; font-family: 'Roboto', sans-serif;
            background: var(--bg-dark); color: var(--text-white);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden; padding: 20px 0;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; margin-bottom: 30px; }
        .logo { width: 180px; margin-bottom: 25px; }
        
        .interactive-area { position: relative; width: 100%; height: 75px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background: var(--card-bg); 
            border: 1px solid rgba(79,172,254,0.3); border-radius: 8px;
            position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 15px; color: #fff; font-size: 1.2rem;
            outline: none; text-align: center; letter-spacing: 3px;
        }

        .status-plate { display: none; align-items: center; padding: 0 12px; background: #0a1626; z-index: 5; }
        .avatar-container { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; background: #1a2a3a; border: 1px solid var(--accent-blue); }

        .info { flex-grow: 1; text-align: left; padding: 0 12px; overflow: hidden; }
        .info b { display: block; color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info span { font-size: 0.75rem; opacity: 0.7; display: block; }
        .guild-line { color: var(--swgoh-green) !important; font-weight: bold; }

        .reset-btn { cursor: pointer; opacity: 0.6; filter: invert(1); width: 18px; }

        .submit-btn {
            width: 100%; padding: 18px; font-family: 'Montserrat', sans-serif; font-weight: 700;
            text-transform: uppercase; color: rgba(255,255,255,0.3); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: var(--card-bg);
            cursor: not-allowed; transition: 0.3s;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green), #0f400b);
            border: 1px solid #45f53d; color: #fff; cursor: pointer;
        }

        /* Секция склада */
        #inventory {
            width: 95%; max-width: 800px; display: none;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; padding: 20px 0;
        }

        .unit-card {
            background: var(--card-bg); border-radius: 8px; padding: 10px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .unit-name { font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; height: 2.4em; overflow: hidden; }
        .unit-gear { color: #f8b700; font-size: 0.75rem; font-weight: bold; }
        .unit-power { font-size: 0.7rem; opacity: 0.6; }
        .relic-badge { 
            background: #e91e63; color: white; border-radius: 50%; 
            width: 20px; height: 20px; font-size: 0.7rem; line-height: 20px;
            position: absolute; top: 5px; right: 5px; font-weight: bold;
        }

        .loader { width: 24px; height: 24px; border: 2px solid rgba(79,172,254,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 13px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" class="logo">
    
    <div class="interactive-area">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
        
        <div id="statusPlate" class="status-plate">
            <div id="avatarBox" class="avatar-container"><div class="loader"></div></div>
            <div class="info">
                <b id="pName">Загрузка...</b>
                <span id="pDesc">Синхронизация</span>
                <span id="pGuild" class="guild-line"></span>
            </div>
            <img src="https://img.icons8.com/?size=100&id=95867&format=png" class="reset-btn" id="resetBtn">
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
</div>

<div id="inventory"></div>

<script>
    const WORKER_URL = 'https://swgoh-auth.grasshop119.workers.dev/';
    const input = document.getElementById('allyCode');
    const plate = document.getElementById('statusPlate');
    const submitBtn = document.getElementById('submitBtn');
    const inventoryDiv = document.getElementById('inventory');

    input.oninput = (e) => {
        let val = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = val.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
        if (val.length === 9) performSearch(val);
    };

    async function performSearch(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        inventoryDiv.style.display = 'none';
        inventoryDiv.innerHTML = '';
        
        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(api)}`);
            const json = await response.json();
            
            const p = json.data || json;

            if (p && p.name) {
                // Основная информация
                document.getElementById('avatarBox').innerHTML = `<img src="${p.portrait_image}" class="avatar" onerror="this.src='Logos/NoShield.png'">`;
                document.getElementById('pName').innerText = p.name;
                document.getElementById('pDesc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M • ${p.level} LVL`;
                document.getElementById('pGuild').innerText = p.guild_name || "";
                
                // Рендерим склад (units)
                if (json.units && json.units.length > 0) {
                    renderInventory(json.units);
                }

                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                throw "empty";
            }
        } catch (e) {
            document.getElementById('avatarBox').innerHTML = `<img src="Logos/NoShield.png" class="avatar">`;
            document.getElementById('pName').innerText = "Не найден";
            document.getElementById('pDesc').innerText = "Ошибка загрузки";
        }
    }

    function renderInventory(units) {
        // Сортируем по мощи (по убыванию)
        const sortedUnits = units.sort((a, b) => b.data.power - a.data.power);
        
        inventoryDiv.innerHTML = sortedUnits.map(unit => {
            const d = unit.data;
            // Уровень реликвии (в API 1 и 2 это заблокированная реликвия, 3+ это фактические уровни)
            const relicLevel = d.relic_tier > 2 ? d.relic_tier - 2 : null;
            
            return `
                <div class="unit-card">
                    ${relicLevel ? `<div class="relic-badge">R${relicLevel}</div>` : ''}
                    <div class="unit-name">${d.name}</div>
                    <div class="unit-gear">G${d.gear_level}</div>
                    <div class="unit-power">${d.power.toLocaleString()} Мощи</div>
                </div>
            `;
        }).join('');
        
        inventoryDiv.style.display = 'grid';
    }

    document.getElementById('resetBtn').onclick = () => {
        plate.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        inventoryDiv.style.display = 'none';
        submitBtn.classList.remove('active');
        submitBtn.disabled = true;
    };
</script>

</body>
</html>
