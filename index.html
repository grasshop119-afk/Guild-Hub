<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            display: flex; justify-content: center; align-items: center; color: var(--text-white);
        }
        .main-content { text-align: center; width: 90%; max-width: 360px; }
        .logo { width: 180px; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }
        .swgoh-input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px; color: #ffffff; font-size: 1.2rem;
            outline: none; text-align: center; letter-spacing: 3px; box-sizing: border-box;
        }
        .guild-preview {
            display: none; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; margin-top: 15px; padding: 15px; align-items: center; text-align: left;
        }
        .guild-icon-box { width: 45px; height: 45px; background: #1a2a3a; border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .guild-name-display { font-weight: 700; color: var(--accent-blue); }
        .submit-btn {
            width: 100%; padding: 20px; margin-top: 20px; font-weight: 700; text-transform: uppercase;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.3);
        }
        .submit-btn.active { background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark)); color: white; cursor: pointer; border: 1px solid #45f53d; }
    </style>
</head>
<body>
    <div class="main-content">
        <img src="https://i.ibb.co/v4x1hC8n/image.png" class="logo">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
        <div id="guildPreview" class="guild-preview">
            <div class="guild-icon-box" id="gIcon">⏳</div>
            <div style="flex-grow:1">
                <div id="guildName" class="guild-name-display">Поиск...</div>
                <div id="guildCount" style="font-size:0.8rem; opacity:0.5"></div>
            </div>
        </div>
        <button id="submitBtn" class="submit-btn">Продолжить</button>
    </div>

    <script>
        const input = document.getElementById('allyCode');
        const btn = document.getElementById('submitBtn');
        const preview = document.getElementById('guildPreview');

        input.addEventListener('input', async (e) => {
            let val = e.target.value.replace(/\D/g, '').substring(0, 9);
            let fmt = "";
            for (let i = 0; i < val.length; i++) {
                if (i > 0 && i % 3 === 0) fmt += "-";
                fmt += val[i];
            }
            e.target.value = fmt;

            if (val.length === 9) {
                preview.style.display = 'flex';
                try {
                    const r = await fetch('/api/check/' + val);
                    const d = await r.json();
                    document.getElementById('guildName').innerText = d.guildName;
                    document.getElementById('guildCount').innerText = d.members + '/50 игроков';
                    document.getElementById('gIcon').innerText = '🛡️';
                    btn.classList.add('active');
                } catch (e) {
                    document.getElementById('guildName').innerText = 'Ошибка';
                }
            } else {
                preview.style.display = 'none';
                btn.classList.remove('active');
            }
        });
    </script>
</body>
</html>
