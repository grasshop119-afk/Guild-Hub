<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Guild Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #999999;
            --tg-theme-secondary-bg-color: #f0f2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        .guild-card {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none; /* Показываем только при результате */
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .guild-avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, button:active {
            background-color: var(--tg-theme-button-color);
            opacity: 1;
        }

        .guild-name {
            font-size: 22px;
            font-weight: 800;
            margin: 10px 0;
            color: var(--tg-theme-text-color);
        }

        .guild-gp {
            font-size: 16px;
            color: var(--tg-theme-hint-color);
        }

        .loader {
            display: none;
            margin: 20px 0;
            color: var(--tg-theme-button-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="guildCard" class="guild-card">
            <div id="guildLogo" class="guild-avatar"></div>
            <div id="guildName" class="guild-name"></div>
            <div id="guildGP" class="guild-gp"></div>
        </div>

        <div id="searchSection">
            <h2 id="mainTitle">Guild Finder</h2>
            <input type="number" id="allyCode" placeholder="Код союзника (9 цифр)" inputmode="numeric">
            <button id="searchBtn" onclick="getGuildData()">Найти гильдию</button>
        </div>
        
        <div id="loader" class="loader">Считывание данных из Голонета...</div>
        <div id="errorMsg" style="color: red; margin-top: 15px;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function getGuildData() {
            const allyInput = document.getElementById('allyCode').value.trim();
            const card = document.getElementById('guildCard');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            
            if (allyInput.length < 9) {
                errorMsg.innerText = "Введите 9 цифр кода союзника";
                return;
            }

            // Сброс состояния
            errorMsg.innerText = "";
            card.style.display = "none";
            loader.style.display = "block";

            const targetUrl = `https://swgoh.gg/api/player/${allyInput}/`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.data && data.data.guild_name) {
                    const p = data.data;
                    
                    document.getElementById('guildName').innerText = p.guild_name;
                    
                    // Форматирование ГМ гильдии (если есть в API игрока)
                    // Иногда API игрока не отдает ГМ всей гильдии, тогда выведем ГМ игрока
                    const gp = p.galactic_power ? (p.galactic_power / 1000000).toFixed(1) + "M GP" : "";
                    document.getElementById('guildGP').innerText = `Игрок: ${gp}`;

                    // Работа с аватаром
                    if (p.guild_banner) {
                        const logoDiv = document.getElementById('guildLogo');
                        // Пробуем основной путь к ассетам
                        const bannerUrl = `https://game-assets.swgoh.gg/static/img/assets/tex.${p.guild_banner}.png`;
                        logoDiv.style.backgroundImage = `url('${bannerUrl}')`;
                    }

                    card.style.display = "block";
                } else {
                    errorMsg.innerText = "Игрок не найден или не состоит в гильдии";
                }

            } catch (error) {
                errorMsg.innerText = "Ошибка API. Попробуйте позже.";
                console.error(error);
            } finally {
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
