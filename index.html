<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Ultimate Analyzer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #3390ec;
            --tg-theme-secondary-bg-color: #f0f2f5;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 400px; text-align: center; }

        input {
            width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #ddd;
            margin-bottom: 15px; font-size: 17px; text-align: center; box-sizing: border-box;
            background: #fafafa; outline: none;
        }

        /* Кнопка: не темнеет при нажатии */
        .btn-main {
            width: 100%; padding: 16px;
            background-color: var(--tg-theme-button-color) !important;
            color: #ffffff !important; border: none; border-radius: 15px;
            font-size: 17px; font-weight: bold; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: none !important;
        }
        .btn-main:active, .btn-main:focus {
            opacity: 1 !important;
            background-color: var(--tg-theme-button-color) !important;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 20px; padding: 20px; margin-top: 20px;
            display: none; border: 1px solid rgba(0,0,0,0.05); text-align: left;
        }

        .nick { font-size: 26px; font-weight: 900; color: var(--tg-theme-button-color); text-align: center; display: block; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { background: #fff; padding: 12px; border-radius: 12px; text-align: center; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; display: block; font-weight: bold; }
        .val { font-size: 16px; font-weight: 800; }

        .loader { display: none; margin-top: 20px; font-weight: bold; color: #888; }
        .status-msg { font-size: 12px; color: #999; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SWGOH Анализатор</h2>
        <input type="number" id="allyCode" placeholder="Код союзника (9 цифр)" inputmode="numeric">
        <button class="btn-main" onclick="runAnalysis()">АНАЛИЗИРОВАТЬ</button>

        <div id="loader" class="loader">
            Поиск данных...
            <div id="status" class="status-msg">Попытка 1/3...</div>
        </div>

        <div id="result" class="card">
            <span id="resNick" class="nick"></span>
            <span id="resTitle" style="font-size:12px; display:block; text-align:center; opacity:0.6; font-weight:bold; margin-bottom:10px;"></span>

            <div class="stat-grid">
                <div class="stat-box"><span class="label">Мощность</span><span id="resGP" class="val"></span></div>
                <div class="stat-box"><span class="label">Уровень</span><span id="resLvl" class="val"></span></div>
                <div class="stat-box"><span class="label">Персонажи</span><span id="resUnits" class="val"></span></div>
                <div class="stat-box"><span class="label">Корабли</span><span id="resShips" class="val"></span></div>
            </div>

            <div style="background:#fff; padding:15px; border-radius:15px;">
                <span class="label">Гильдия</span>
                <span id="resGName" style="font-weight: 800; font-size: 14px;"></span><br>
                <small id="resGId" style="color:#aaa; font-family: monospace; font-size: 10px; word-break: break-all;"></small>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function runAnalysis() {
            const ally = document.getElementById('allyCode').value.trim();
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            if (ally.length < 9) return;

            loader.style.display = "block";
            result.style.display = "none";

            // Очередь прокси-серверов
            const proxyQueue = [
                u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
                u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
                u => `https://thingproxy.freeboard.io/fetch/${u}`
            ];

            let data = null;

            for (let i = 0; i < proxyQueue.length; i++) {
                try {
                    status.innerText = `Использование канала ${i + 1}...`;
                    const targetUrl = `https://swgoh.gg/api/player/${ally}/`;
                    const response = await fetch(proxyQueue[i](targetUrl));
                    
                    if (!response.ok) throw new Error();

                    const res = await response.json();
                    // Обработка разных форматов ответа прокси
                    const content = res.contents ? JSON.parse(res.contents) : res;

                    if (content && content.data) {
                        data = content.data;
                        break; 
                    }
                } catch (e) {
                    console.log(`Proxy ${i+1} failed`);
                }
            }

            if (data) {
                document.getElementById('resNick').innerText = data.name;
                document.getElementById('resTitle').innerText = data.title || "";
                document.getElementById('resGP').innerText = (data.galactic_power / 1000000).toFixed(2) + "M";
                document.getElementById('resLvl').innerText = data.level || "85";
                document.getElementById('resGName').innerText = data.guild_name || "---";
                document.getElementById('resGId').innerText = data.guild_id || "";

                if (data.units && Array.isArray(data.units)) {
                    const chars = data.units.filter(u => u.data && u.data.combat_type === 1).length;
                    const ships = data.units.filter(u => u.data && u.data.combat_type === 2).length;
                    document.getElementById('resUnits').innerText = chars;
                    document.getElementById('resShips').innerText = ships;
                } else {
                    document.getElementById('resUnits').innerText = "0";
                    document.getElementById('resShips').innerText = "0";
                }

                loader.style.display = "none";
                result.style.display = "block";
            } else {
                status.innerText = "Все каналы заняты. Попробуйте снова.";
                setTimeout(() => { loader.style.display = "none"; }, 2000);
            }
        }
    </script>
</body>
</html>
