<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; z-index: 10; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        h1 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; text-transform: uppercase; margin-bottom: 12px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; opacity: 0.8; }

        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 50px; color: #fff; font-size: 1.2rem; outline: none; text-align: center; letter-spacing: 3px;
        }

        .paste-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; fill: rgba(255,255,255,0.4); z-index: 10; padding: 5px; }

        .status-plate { display: none; align-items: center; padding: 0 15px; z-index: 5; }
        .loader-box { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; background: rgba(255,255,255,0.05); }
        .player-portrait { width: 100%; height: 100%; object-fit: cover; }

        .swgoh-spinner {
            width: 20px; height: 20px; border: 2px solid rgba(79,172,254,0.1);
            border-top: 2px solid var(--accent-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-info-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px; align-items: flex-start; text-align: left; }
        .player-rank-title { font-size: 0.65rem; color: rgba(255,255,255,0.5); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .player-name-success { color: var(--accent-blue); font-size: 1rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .player-gp-sub { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

        .reset-icon { width: 24px; cursor: pointer; filter: invert(1); opacity: 0.5; }

        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase;
            color: rgba(255,255,255,0.2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); cursor: not-allowed; transition: 0.3s;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark));
            border-color: #45f53d; color: #fff; cursor: pointer;
        }

        /* Защита Share-кнопки от затемнения */
        .share-btn:hover, .submit-btn.active:hover { filter: none !important; opacity: 1 !important; }

        .disclaimer-bar { position: fixed; bottom: -300px; left: 0; width: 100%; background: #fff; color: #000; padding: 15px 20px; transition: 0.6s; z-index: 1000; text-align: left; font-size: 0.75rem; }
        .disclaimer-bar.active { bottom: 0; }
        .credits { font-size: 0.7rem; margin-top: 25px; color: rgba(255,255,255,0.3); }
        .credits a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

<div id="disclaimer" class="disclaimer-bar">
    <b>ОТКАЗ ОТ ОТВЕТСТВЕННОСТИ</b>
    <p>Информация предоставлена открытыми источниками. <a href="Decline.txt">Подробнее.</a></p>
    <button onclick="document.getElementById('disclaimer').classList.remove('active')">ОК</button>
</div>

<div class="main-content">
    <img src="Logos/Logo.png" class="logo">
    <h1>Авторизация</h1>
    <p class="description">Введи <b>код союзника</b></p>

    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
            <div class="paste-icon" id="pasteBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
            </div>
        </div>

        <div id="statusPlate" class="status-plate">
            <div id="statusVisual" class="loader-box"></div>
            <div class="status-info-wrapper">
                <span id="playerRank" class="player-rank-title"></span>
                <span id="statusText" class="player-name-success">Синхронизация...</span>
                <span id="subText" class="player-gp-sub"></span>
            </div>
            <img src="https://img.icons8.com/?size=100&id=95867&format=png" class="reset-icon" id="resetBtn">
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
    <div class="credits">By <a href="https://t.me/tz_projects">@tz_projects</a></div>
</div>

<script>
    const worker = 'https://swgoh-auth.grasshop119.workers.dev/';
    const input = document.getElementById('allyCode');
    const plate = document.getElementById('statusPlate');
    const box = document.getElementById('inputContainer');
    const btn = document.getElementById('submitBtn');

    function format(v) {
        let d = v.replace(/\D/g, '').substring(0, 9);
        return d.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
    }

    input.oninput = () => {
        input.value = format(input.value);
        if (input.value.replace(/\D/g, '').length === 9) {
            input.blur();
            fetchPlayer();
        }
    };

    async function fetchPlayer() {
        const code = input.value.replace(/\D/g, '');
        box.style.display = 'none';
        plate.style.display = 'flex';
        document.getElementById('statusVisual').innerHTML = '<div class="swgoh-spinner"></div>';
        document.getElementById('statusText').innerText = 'Синхронизация...';

        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            const r = await fetch(`${worker}?url=${encodeURIComponent(api)}&t=${Date.now()}`);
            const j = await r.json();

            // Поиск данных: берем всё, что похоже на имя и мощь
            const p = j.data || j.player_data || (j.name ? j : null);

            if (p && (p.name || p.username)) {
                const name = p.name || p.username;
                const gp = p.galactic_power || 0;
                const img = p.portrait_image || 'Logos/NoShield.png';
                
                document.getElementById('statusVisual').innerHTML = `<img src="${img}" class="player-portrait" onerror="this.src='Logos/NoShield.png'">`;
                document.getElementById('playerRank').innerText = (p.guild_name || "ИГРОК").toUpperCase();
                document.getElementById('statusText').innerText = name;
                document.getElementById('subText').innerText = `ГМ: ${(gp/1000000).toFixed(2)}M • LVL ${p.level || 85}`;
                
                btn.classList.add('active');
                btn.disabled = false;
            } else {
                throw 0;
            }
        } catch (e) {
            document.getElementById('statusVisual').innerHTML = `<img src="Logos/NoShield.png" class="player-portrait">`;
            document.getElementById('playerRank').innerText = "";
            document.getElementById('statusText').innerText = "Игрок не найден";
            document.getElementById('subText').innerText = "";
        }
    }

    document.getElementById('resetBtn').onclick = () => {
        plate.style.display = 'none';
        box.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
        btn.disabled = true;
    };

    document.getElementById('pasteBtn').onclick = async () => {
        const t = await navigator.clipboard.readText();
        input.value = format(t);
        if (input.value.replace(/\D/g, '').length === 9) fetchPlayer();
    };

    window.onload = () => setTimeout(() => document.getElementById('disclaimer').classList.add('active'), 1000);
</script>
</body>
</html>
