<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Player Info</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .search-box { margin-bottom: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
        
        #player-card { 
            background: #1e1e1e; padding: 20px; border-radius: 10px; 
            display: none; border: 1px solid #333; max-width: 400px; text-align: center;
        }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #edb219; }
        .guild-logo { width: 50px; vertical-align: middle; }
        .info-row { margin: 10px 0; }
        .label { color: #888; font-size: 0.9em; }
        /* Сохраняем стиль кнопки Share по вашему запросу */
        .share-btn { background: #28a745; margin-top: 15px; }
        .share-btn:hover { background: #28a745 !important; opacity: 0.9; }
    </style>
</head>
<body>

    <h2>Поиск игрока SWGOH</h2>
    
    <div class="search-box">
        <input type="text" id="allyCode" placeholder="Введите код (например, 123456789)">
        <button onclick="fetchPlayer()">Найти</button>
    </div>

    <div id="loading" style="display: none;">Загрузка...</div>

    <div id="player-card">
        <img id="p-avatar" class="avatar" src="" alt="Avatar">
        <h3 id="p-name"></h3>
        <div class="info-row">
            <span class="label">Звание:</span> <span id="p-title"></span>
        </div>
        <hr>
        <div class="info-row">
            <img id="g-logo" class="guild-logo" src="" alt="Guild">
            <span id="g-name" style="font-weight: bold; font-size: 1.2em;"></span>
        </div>
        <div class="info-row">
            <span class="label">Роль в гильдии:</span> <span id="g-role"></span>
        </div>
        <button class="share-btn">Поделиться</button>
    </div>

    <script>
        async function fetchPlayer() {
            const allyCode = document.getElementById('allyCode').value.replace(/-/g, '');
            const card = document.getElementById('player-card');
            const loader = document.getElementById('loading');
            
            if (!allyCode) return alert('Введите код союзника');

            loader.style.display = 'block';
            card.style.display = 'none';

            try {
                // Вызываем нашу Vercel функцию
                const response = await fetch(`/api?allyCode=${allyCode}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const p = data.data;
                
                // Заполнение данных
                document.getElementById('p-name').textContent = p.name;
                document.getElementById('p-title').textContent = p.title || 'Нет звания';
                document.getElementById('p-avatar').src = `https://game-assets.swgoh.gg/tex.charui_portrait_${p.portrait_id}.png`;
                
                document.getElementById('g-name').textContent = p.guild_name;
                document.getElementById('g-role').textContent = getRoleName(p.guild_member_level);
                
                // Логотип гильдии (заглушка, так как API отдает ID баннера, а не прямую ссылку)
                document.getElementById('g-logo').src = `https://game-assets.swgoh.gg/static/assets/textures/gui/guild/guild_logo_white.png`;

                card.style.display = 'block';
            } catch (err) {
                alert('Ошибка: ' + err.message);
            } finally {
                loader.style.display = 'none';
            }
        }

        function getRoleName(level) {
            const roles = { 2: 'Участник', 3: 'Офицер', 4: 'Лидер' };
            return roles[level] || 'Гость';
        }
    </script>
</body>
</html>
