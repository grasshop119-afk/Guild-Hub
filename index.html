<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Guild MiniApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #999999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .guild-avatar {
            width: 120px;
            height: 120px;
            background-color: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: none; 
            background-size: cover;
            background-position: center;
            border: 4px solid var(--tg-theme-button-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: none; 
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, button:active {
            background-color: var(--tg-theme-button-color);
            opacity: 1;
        }

        #result {
            margin-top: 15px;
            font-weight: 800;
            font-size: 22px;
            color: var(--tg-theme-button-color);
        }

        .loader {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: var(--tg-theme-hint-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="guildLogo" class="guild-avatar"></div>
        <h2 id="title">SWGOH Гильдия</h2>
        
        <input type="number" id="allyCode" placeholder="Код союзника (9 цифр)" inputmode="numeric">
        <button id="searchBtn" onclick="getGuildData()">Найти гильдию</button>
        
        <div id="loader" class="loader">Получаем данные из Голонета...</div>
        <div id="result"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function getGuildData() {
            const allyInput = document.getElementById('allyCode').value.trim();
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const logo = document.getElementById('guildLogo');

            if (allyInput.length < 9) {
                resultDiv.innerText = "Нужно 9 цифр";
                return;
            }

            resultDiv.innerText = "";
            logo.style.display = "none";
            logo.style.backgroundImage = "none";
            loader.style.display = "block";

            // Используем corsproxy для обхода блокировок
            const targetUrl = `https://swgoh.gg/api/player/${allyInput}/`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.data && data.data.guild_name) {
                    resultDiv.innerText = data.data.guild_name;

                    // Логика иконки
                    // API swgoh.gg возвращает ID баннера в поле guild_banner
                    let bannerId = data.data.guild_banner;
                    
                    if (bannerId) {
                        // Формируем URL. Обычно это tex.НАЗВАНИЕ
                        const iconUrl = `https://game-assets.swgoh.gg/static/img/assets/tex.${bannerId}.png`;
                        
                        // Предзагрузка изображения, чтобы не было мигания
                        const img = new Image();
                        img.onload = function() {
                            logo.style.backgroundImage = `url('${iconUrl}')`;
                            logo.style.display = "block";
                        };
                        img.onerror = function() {
                            // Если картинка не найдена, пробуем без префикса "tex."
                            const altUrl = `https://game-assets.swgoh.gg/static/img/assets/${bannerId}.png`;
                            logo.style.backgroundImage = `url('${altUrl}')`;
                            logo.style.display = "block";
                        };
                        img.src = iconUrl;
                    }
                } else {
                    resultDiv.innerText = "Игрок не в гильдии";
                }

            } catch (error) {
                resultDiv.innerText = "Ошибка поиска";
                console.error(error);
            } finally {
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
