<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #050b14; --blue: #4facfe; --green: #26b31e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: 'Roboto', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; position: fixed; width: 100%;
        }

        .container { width: 90%; max-width: 360px; text-align: center; }
        .logo { width: 180px; margin-bottom: 25px; }

        .input-box { position: relative; height: 62px; margin-bottom: 20px; }
        
        input, .plate { 
            width: 100%; height: 100%; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(79,172,254,0.3); border-radius: 8px; 
            color: white; text-align: center; font-size: 1.2rem; outline: none; 
        }

        .plate { 
            display: none; align-items: center; padding: 0 12px; 
            text-align: left; position: absolute; top: 0; left: 0; 
            background: #0a1626; z-index: 5; 
        }

        .avatar { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; margin-right: 12px; }
        
        .info { flex-grow: 1; overflow: hidden; }
        .info b { display: block; color: var(--blue); text-transform: uppercase; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info span { font-size: 0.75rem; opacity: 0.5; }

        .reset { cursor: pointer; opacity: 0.5; filter: invert(1); width: 20px; padding: 5px; box-sizing: content-box; }

        .btn { 
            width: 100%; padding: 20px; border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); 
            color: rgba(255,255,255,0.3); font-family: 'Montserrat'; font-weight: 700; 
            text-transform: uppercase; cursor: not-allowed; transition: 0.3s; 
        }

        .btn.active { 
            background: linear-gradient(to top, var(--green), #0f400b); 
            color: white; cursor: pointer; border-color: #45f53d; 
        }

        /* Защита от затемнения Share/Submit */
        .btn.active:hover, .btn.active:active { filter: none !important; opacity: 1 !important; background: linear-gradient(to top, var(--green), #0f400b) !important; }

        .loader { 
            width: 20px; height: 20px; border: 2px solid rgba(79,172,254,0.1); 
            border-top-color: var(--blue); border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <img src="Logos/Logo.png" class="logo">
    <div class="input-box">
        <input type="text" id="code" placeholder="Код союзника" maxlength="11" inputmode="numeric">
        <div id="plate" class="plate">
            <div id="v-box" style="margin-right:12px"><div class="loader"></div></div>
            <div class="info">
                <b id="p-name">Загрузка...</b>
                <span id="p-desc">Синхронизация</span>
            </div>
            <img src="https://img.icons8.com/?size=100&id=95867&format=png" class="reset" id="reset">
        </div>
    </div>
    <button id="btn" class="btn">Продолжить</button>
</div>

<script>
    const WORKER = 'https://swgoh-auth.grasshop119.workers.dev/';
    const input = document.getElementById('code');
    const plate = document.getElementById('plate');
    const btn = document.getElementById('btn');

    input.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
        if (v.length === 9) {
            input.blur();
            loadPlayer(v);
        }
    };

    async function loadPlayer(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        
        // Сброс состояния перед запросом
        document.getElementById('p-name').innerText = "Загрузка...";
        document.getElementById('p-desc').innerText = "Синхронизация";
        document.getElementById('v-box').innerHTML = '<div class="loader"></div>';

        try {
            // Двойной кэш-бастер для пробития мобильных браузеров
            const target = `https://swgoh.gg/api/player/${code}/?nc=${Date.now()}`;
            const finalUrl = `${WORKER}?url=${encodeURIComponent(target)}&_=${Date.now()}`;

            const response = await fetch(finalUrl, { 
                method: 'GET',
                cache: 'no-store'
            });
            
            const result = await response.json();
            // Ищем данные в объекте 'data', как на твоем скриншоте
            const p = result.data || result;

            if (p && (p.name || p.username)) {
                document.getElementById('v-box').innerHTML = `<img src="${p.portrait_image}" class="avatar" onerror="this.src='Logos/NoShield.png'">`;
                document.getElementById('p-name').innerText = p.name || p.username;
                document.getElementById('p-desc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M • ${p.level || 85} LVL`;
                
                btn.classList.add('active');
                btn.disabled = false;
            } else {
                throw "empty";
            }
        } catch (err) {
            document.getElementById('v-box').innerHTML = `<img src="Logos/NoShield.png" class="avatar">`;
            document.getElementById('p-name').innerText = "Не найден";
            document.getElementById('p-desc').innerText = "";
            btn.classList.remove('active');
            btn.disabled = true;
        }
    }

    document.getElementById('reset').onclick = () => {
        plate.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
        btn.disabled = true;
    };
</script>

</body>
</html>
