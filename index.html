<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guild Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent: #4facfe;
            --green: #26b31e;
            --border: rgba(30, 58, 95, 0.8);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark); color: white;
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .container { width: 90%; max-width: 360px; text-align: center; }
        .logo { width: 180px; margin-bottom: 25px; }
        .input-box {
            width: 100%; background: rgba(5, 13, 22, 0.8); border: 1px solid var(--border);
            border-radius: 10px; padding: 18px; color: white; font-size: 1.2rem;
            text-align: center; letter-spacing: 2px; outline: none; margin-bottom: 15px;
        }
        .guild-card {
            display: none; background: rgba(30, 58, 95, 0.2); border: 1px solid var(--border);
            border-radius: 10px; padding: 15px; margin-bottom: 20px; align-items: center; text-align: left;
        }
        .guild-img { width: 45px; height: 45px; border-radius: 6px; margin-right: 15px; background-size: cover; border: 1px solid rgba(255,255,255,0.1); }
        .guild-info { overflow: hidden; }
        .g-name { font-weight: 700; color: var(--accent); font-size: 1rem; display: block; }
        .p-name { font-size: 0.8rem; opacity: 0.6; }
        .btn {
            width: 100%; padding: 20px; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.2);
            font-weight: 700; text-transform: uppercase; cursor: not-allowed; transition: 0.3s;
        }
        .btn.active { background: linear-gradient(to top, var(--green), #0f400b); color: white; cursor: pointer; border: 1px solid #45f53d; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" class="logo">
    <input type="text" id="codeInp" class="input-box" placeholder="000-000-000" maxlength="11">

    <div id="guildCard" class="guild-card">
        <div id="gImg" class="guild-img"></div>
        <div class="guild-info">
            <span id="gName" class="g-name">...</span>
            <span id="pName" class="p-name">...</span>
        </div>
    </div>

    <button id="mainBtn" class="btn">Продолжить</button>
</div>

<script>
    const inp = document.getElementById('codeInp');
    const btn = document.getElementById('mainBtn');
    const card = document.getElementById('guildCard');

    inp.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '').substring(0, 9);
        let fmt = "";
        for (let i = 0; i < val.length; i++) {
            if (i > 0 && i % 3 === 0) fmt += "-";
            fmt += val[i];
        }
        e.target.value = fmt;

        if (val.length === 9) {
            fetchData(val);
        } else {
            card.style.display = 'none';
            btn.classList.remove('active');
        }
    });

    async function fetchData(code) {
        card.style.display = 'flex';
        document.getElementById('gName').innerText = "Поиск...";
        document.getElementById('pName').innerText = "Синхронизация данных";
        
        try {
            const r = await fetch(`/api/check/${code}`);
            if (!r.ok) throw new Error();
            const d = await r.json();

            document.getElementById('gName').innerText = d.guildName;
            document.getElementById('pName').innerText = `Игрок: ${d.playerName}`;
            document.getElementById('gImg').style.backgroundImage = `url('${d.guildBanner}')`;
            btn.classList.add('active');
        } catch (e) {
            document.getElementById('gName').innerText = "Не найдено";
            document.getElementById('pName').innerText = "Проверь код союзника";
            btn.classList.remove('active');
        }
    }
</script>
</body>
</html>
