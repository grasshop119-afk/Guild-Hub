<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        h1 { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .swgoh-input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px; color: #fff; font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem; text-align: center; letter-spacing: 3px; outline: none; box-sizing: border-box;
        }

        /* Плашка гильдии */
        .guild-preview {
            display: none; background: rgba(15, 27, 42, 0.9); border: 1px solid var(--accent-blue);
            border-radius: 8px; margin-bottom: 15px; padding: 12px; align-items: center; text-align: left;
        }
        .guild-icon-box {
            width: 45px; height: 45px; background: #1a2a3a; border-radius: 6px;
            margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        .guild-name-display { font-weight: 700; font-size: 0.9rem; color: var(--accent-blue); display: block; }

        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif; font-weight: 700;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.3); border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease; letter-spacing: 2px; cursor: not-allowed;
        }
        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }

        /* Кнопка Share (не темнеет) */
        .share-btn { 
            margin-top: 20px; background: var(--accent-blue); border: none; padding: 15px; 
            color: white; border-radius: 8px; font-weight: bold; width: 100%; 
        }
        .share-btn:hover, .share-btn:active { background: var(--accent-blue) !important; filter: none !important; opacity: 1 !important; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой <b>код союзника</b></p>

    <div class="input-wrapper">
        <input type="number" id="allyCode" class="swgoh-input" placeholder="000000000">
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon-box">
            <span id="guildEmoji">⏳</span>
            <img id="guildImg" src="https://swgoh.gg/static/img/assets/tex.guild_avatar_mon_calamari_01.png" style="width:100%; display:none;">
        </div>
        <div class="guild-info-text">
            <span id="guildNameDisplay" class="guild-name-display">Поиск...</span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const preview = document.getElementById('guildPreview');
    const gName = document.getElementById('guildNameDisplay');
    const gEmoji = document.getElementById('guildEmoji');
    const gImg = document.getElementById('guildImg');

    async function checkGuild(code) {
        if (code.length !== 9) {
            preview.style.display = 'none';
            btn.classList.remove('active');
            return;
        }

        preview.style.display = 'flex';
        gName.innerText = "Поиск гильдии...";
        gEmoji.innerText = "⏳";
        gImg.style.display = "none";

        // ТА САМАЯ РАБОЧАЯ ЛОГИКА (corsproxy.io)
        const proxy = "https://corsproxy.io/?";
        try {
            const pResp = await fetch(`${proxy}https://swgoh.gg/api/player/${code}/`);
            const pData = await pResp.json();
            const gId = pData.data.guild_id;

            if (!gId) throw new Error();

            const gResp = await fetch(`${proxy}https://swgoh.gg/api/guild-profile/${gId}/`);
            const gData = await gResp.json();

            gName.innerText = gData.data.name;
            gEmoji.innerText = "";
            gImg.style.display = "block";
            btn.classList.add('active');

        } catch (err) {
            gName.innerText = "Гильдия не найдена";
            gEmoji.innerText = "🤔";
            gImg.style.display = "none";
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', (e) => {
        if (e.target.value.length > 9) e.target.value = e.target.value.slice(0, 9);
        checkGuild(e.target.value);
    });
</script>

</body>
</html>
