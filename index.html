<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
            touch-action: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        h1 { font-size: clamp(1.2rem, 5vw, 1.4rem); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: clamp(0.8rem, 3.5vw, 0.9rem); margin-bottom: 25px; padding: 0 10px; opacity: 0.8; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .swgoh-input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px 50px 18px 18px; color: #ffffff;
            font-family: 'Montserrat', sans-serif; font-size: clamp(1.1rem, 4vw, 1.2rem);
            outline: none; text-align: center; letter-spacing: 3px;
            transition: border-color 0.3s ease;
        }
        .swgoh-input:focus { border-color: var(--accent-blue); }

        .paste-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; fill: rgba(255, 255, 255, 0.4); display: flex; align-items: center; padding: 8px;
            transition: fill 0.2s;
        }
        .paste-icon:hover { fill: var(--accent-blue); }

        .guild-preview {
            display: none; 
            background: rgba(30, 58, 95, 0.2); 
            border: 1px solid var(--border-default);
            border-radius: 8px; 
            margin-bottom: 20px; 
            padding: 12px 14px; 
            align-items: center; 
            text-align: left;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guild-icon-box {
            width: 36px; height: 36px; 
            background: rgba(0, 0, 0, 0.3); 
            border-radius: 6px;
            margin-right: 12px; flex-shrink: 0; 
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .guild-icon-img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
        
        .guild-info-wrapper {
            display: flex; flex-direction: column; justify-content: center; flex-grow: 1;
        }
        .guild-name-display { 
            font-weight: 700; font-size: 0.9rem; color: var(--accent-blue); 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; 
        }
        .guild-sub-text { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 1px; }

        .submit-btn {
            position: relative; width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; letter-spacing: 2px;
            overflow: hidden;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
        }

        .glow-line {
            position: absolute; bottom: -1px; left: 50%; width: 70%; height: 3px;
            background: radial-gradient(circle, #ffffff 0%, #ffffff 20%, transparent 80%);
            transform: translateX(-50%); opacity: 0; filter: blur(0.5px);
            transition: opacity 0.3s;
        }
        .submit-btn.active:hover .glow-line { opacity: 1; }

        .tg-login { font-size: 0.85rem; margin-top: 25px; opacity: 0.7; }
        .tg-login a { color: var(--accent-blue); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой <b>код союзника</b> для входа</p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        <div class="paste-icon" id="pasteBtn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
        </div>
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon-box">
            <img id="guildImg" class="guild-icon-img" src="" style="display:none;">
            <span id="guildEmoji" style="font-size: 16px;">⏳</span>
        </div>
        <div class="guild-info-wrapper">
            <span id="guildNameDisplay" class="guild-name-display">Ищу твою гильдию...</span>
            <span id="guildSubText" class="guild-sub-text">Пожалуйста, подожди</span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить
        <div class="glow-line"></div>
    </button>

    <div class="tg-login">
        Есть аккаунт? <a href="#">Войти с Telegram</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const guildPreview = document.getElementById('guildPreview');
    const guildImg = document.getElementById('guildImg');
    const guildEmoji = document.getElementById('guildEmoji');
    const guildNameDisplay = document.getElementById('guildNameDisplay');
    const guildSubText = document.getElementById('guildSubText');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    async function findGuild(code) {
        guildPreview.style.display = 'flex';
        guildNameDisplay.innerText = 'Ищу твою гильдию...';
        guildSubText.innerText = 'Пожалуйста, подожди';
        guildEmoji.innerText = '⏳';
        guildImg.style.display = 'none';
        btn.classList.remove('active');
        
        try {
            // Теперь стучимся на твой собственный сервер на Render
            const response = await fetch(`/api/player/${code}`);
            if (!response.ok) throw new Error();
            const pData = await response.json();
            
            const gName = pData.data.guild_name || "Без гильдии";
            const playerName = pData.data.name;

            guildNameDisplay.innerText = gName;
            guildSubText.innerText = `Игрок: ${playerName}`;
            
            guildImg.src = "https://game-assets.swgoh.gg/tex.guild_avatar_mon_calamari_01.png";
            guildImg.style.display = 'block';
            guildEmoji.innerText = '';
            
            localStorage.setItem('ally_code', code);
            localStorage.setItem('hub_auth', 'true');
            btn.classList.add('active');
        } catch (err) {
            guildNameDisplay.innerText = 'Код не найден';
            guildSubText.innerText = 'Проверь его ещё раз';
            guildEmoji.innerText = '❌';
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        let pureDigits = input.value.replace(/\D/g, '');
        if (pureDigits.length === 9) {
            findGuild(pureDigits);
        } else {
            guildPreview.style.display = 'none';
            btn.classList.remove('active');
        }
    });

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = text;
            input.dispatchEvent(new Event('input'));
        } catch (err) {}
    });

    btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
            window.location.href = 'main.html';
        }
    });

    setTimeout(() => input.focus(), 300);
</script>
</body>
</html>
