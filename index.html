<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWGOH Guild Hub</title>
    <style>
        /* Минималистичный темный дизайн для мобилок */
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #0a0a0a; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; min-height: 100vh;
        }
        .search-container { width: 100%; max-width: 350px; text-align: center; }
        
        input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; 
            background: #1a1a1a; color: white; font-size: 18px; margin-bottom: 10px;
            box-sizing: border-box; outline: none;
        }
        
        button { 
            width: 100%; padding: 15px; border-radius: 12px; border: none; 
            background: #007bff; color: white; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }

        #player-card { 
            display: none; width: 100%; max-width: 350px; 
            background: #151515; border-radius: 20px; padding: 25px; 
            margin-top: 25px; border: 1px solid #222; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #edb219; margin-bottom: 15px; }
        .gm-val { color: #edb219; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .guild-name { color: #4db8ff; font-size: 18px; font-weight: bold; }
        
        /* Твоя просьба: кнопка Share не темнеет */
        .share-btn { background: #28a745 !important; margin-top: 20px; }
        .share-btn:hover { background: #28a745 !important; opacity: 0.9; }

        #status { margin-top: 15px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="search-container">
        <h2 style="color: #edb219;">GUILD HUB</h2>
        <input type="tel" id="allyCode" placeholder="Код союзника" maxlength="9">
        <button onclick="fetchData()">ПОИСК В ГОЛОНЕТЕ</button>
        <div id="status"></div>
    </div>

    <div id="player-card">
        <img id="p-avatar" class="avatar" src="">
        <h2 id="p-name" style="margin: 5px 0; font-size: 24px;"></h2>
        <div id="p-title" style="color: #888; font-style: italic; margin-bottom: 10px;"></div>
        
        <div class="gm-val" id="p-gm"></div>
        
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px;">
            <span class="guild-name" id="g-name"></span>
            <div id="g-role" style="font-size: 14px; color: #777; margin-top: 5px;"></div>
        </div>

        <button class="share-btn">ПОДЕЛИТЬСЯ</button>
    </div>

    <script>
        async function fetchData() {
            const code = document.getElementById('allyCode').value.replace(/\D/g, '');
            const status = document.getElementById('status');
            const card = document.getElementById('player-card');

            if (code.length < 9) return alert('Введите 9 цифр');

            status.textContent = "📡 Подключение к спутнику...";
            card.style.display = 'none';

            // Используем AllOrigins, но с проверкой типа контента
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://swgoh.gg/api/player/' + code + '/')}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Сетевая ошибка');
                
                const json = await response.json();
                // Распаковываем данные (fiz.json структура)
                const result = JSON.parse(json.contents);
                const p = result.data;

                if (!p) throw new Error('Игрок не найден');

                // Отрисовка
                document.getElementById('p-avatar').src = `https://game-assets.swgoh.gg/tex.charui_portrait_${p.portrait_id}.png`;
                document.getElementById('p-name').textContent = p.name;
                document.getElementById('p-title').textContent = p.title || 'Ветеран';
                document.getElementById('p-gm').textContent = p.galactic_power.toLocaleString() + ' GM';
                document.getElementById('g-name').textContent = p.guild_name;
                document.getElementById('g-role').textContent = getRole(p.guild_member_level);

                card.style.display = 'block';
                status.textContent = "";
            } catch (e) {
                console.error(e);
                status.innerHTML = "<span style='color: #ff4d4d;'>Ошибка: Запрос заблокирован мобильным оператором. Попробуйте VPN.</span>";
            }
        }

        function getRole(lvl) {
            return lvl === 4 ? 'Лидер' : (lvl === 3 ? 'Офицер' : 'Участник');
        }
    </script>
</body>
</html>
