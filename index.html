<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14; --accent-blue: #4facfe; --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b; --text-white: #ffffff; --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark); color: var(--text-white); overflow: hidden; position: fixed;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
        }
        .main-content { text-align: center; width: 90%; max-width: 360px; z-index: 10; }
        .logo { width: 180px; margin: 0 auto 20px; display: block; }
        h1 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; opacity: 0.8; }
        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }
        .swgoh-input, .status-plate { width: 100%; height: 100%; background: var(--input-bg); border: 1px solid var(--border-default); border-radius: 8px; position: absolute; left: 0; top: 0; }
        .swgoh-input { color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 2px; outline: none; padding: 0 45px; }
        .paste-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.5; z-index: 11; }
        .status-plate { display: none; align-items: center; padding: 0 15px; }
        .loader-box { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .player-portrait { width: 100%; height: 100%; object-fit: cover; }
        .status-info { flex-grow: 1; text-align: left; padding-left: 12px; overflow: hidden; }
        .p-name { color: var(--accent-blue); font-weight: bold; font-size: 1rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; display: block; }
        .p-details { font-size: 0.7rem; opacity: 0.6; display: block; }
        .reset-icon { cursor: pointer; opacity: 0.5; padding: 5px; }
        .submit-btn { width: 100%; padding: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); font-weight: bold; text-transform: uppercase; transition: 0.3s; cursor: not-allowed; }
        .submit-btn.active { background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark)); color: #fff; cursor: pointer; border: 1px solid #45f53d; }
        .credits { font-size: 0.7rem; margin-top: 25px; opacity: 0.4; line-height: 1.3; }
        .credits a { color: var(--accent-blue); text-decoration: none; }
        .swgoh-spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" alt="GUILD HUB" class="logo" onerror="this.style.display='none'">
    <h1>Вход в систему</h1>
    <p class="description">Введите <b>код союзника</b></p>

    <div class="interactive-area">
        <div id="inputBox">
            <input type="text" id="allyInput" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
            <div class="paste-icon" id="pasteAction">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            </div>
        </div>

        <div id="statusBox" class="status-plate">
            <div id="visualBox" class="loader-box"><div class="swgoh-spinner"></div></div>
            <div class="status-info">
                <span id="nameLabel" class="p-name">Загрузка...</span>
                <span id="infoLabel" class="p-details">Проверка данных...</span>
            </div>
            <div class="reset-icon" id="resetAction">
                <svg width="20" height="20" stroke="white" stroke-width="2" fill="none" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5"/></svg>
            </div>
        </div>
    </div>

    <button id="mainBtn" class="submit-btn">Продолжить</button>

    <div class="credits">
        Гильдия <b>Те, кто в тени</b><br>
        Dev: <a href="https://t.me/tz_projects" target="_blank">@tz_projects</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyInput');
    const inputBox = document.getElementById('inputBox');
    const statusBox = document.getElementById('statusBox');
    const nameLabel = document.getElementById('nameLabel');
    const infoLabel = document.getElementById('infoLabel');
    const visualBox = document.getElementById('visualBox');
    const mainBtn = document.getElementById('mainBtn');

    function format(v) {
        let d = v.replace(/\D/g, '').substring(0, 9);
        return d.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
    }

    async function callAPI(code) {
        const url = `https://swgoh.gg/api/player/${code}/`;
        const proxies = [
            `https://corsproxy.io/?${encodeURIComponent(url)}`,
            `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&_=${Date.now()}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        for (let p of proxies) {
            try {
                const res = await fetch(p);
                if (!res.ok) continue;
                let data = await res.json();
                if (p.includes('allorigins')) data = JSON.parse(data.contents);
                if (data && (data.data || data.name)) return data.data || data;
            } catch (e) { console.log("Proxy bypass failed"); }
        }
        return null;
    }

    async function check() {
        const code = input.value.replace(/\D/g, '');
        if (code.length !== 9) return;

        inputBox.style.display = 'none';
        statusBox.style.display = 'flex';
        nameLabel.innerText = 'Поиск...';

        const player = await callAPI(code);
        
        if (player && player.name) {
            visualBox.innerHTML = `<img src="${player.portrait_image || 'https://game-assets.swgoh.gg/textures/tex.vanity_stormtrooper.png'}" class="player-portrait">`;
            nameLabel.innerText = player.name;
            infoLabel.innerText = `ГМ: ${(player.galactic_power/1000000).toFixed(2)}M • ${player.level} LVL`;
            mainBtn.classList.add('active');
        } else {
            nameLabel.innerText = 'Ошибка';
            infoLabel.innerText = 'Игрок не найден';
            visualBox.innerHTML = '❌';
        }
    }

    input.addEventListener('input', (e) => {
        input.value = format(input.value);
        if (input.value.replace(/\D/g, '').length === 9) { input.blur(); check(); }
    });

    document.getElementById('resetAction').onclick = () => {
        statusBox.style.display = 'none';
        inputBox.style.display = 'block';
        input.value = '';
        mainBtn.classList.remove('active');
        visualBox.innerHTML = '<div class="swgoh-spinner"></div>';
    };

    document.getElementById('pasteAction').onclick = async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = format(text);
            if (input.value.replace(/\D/g, '').length === 9) check();
        } catch(e) { input.focus(); }
    };
</script>

</body>
</html>
