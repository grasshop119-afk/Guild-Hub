<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        /* [Стили из твоего оригинала сохранены] */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Montserrat', sans-serif; background-color: var(--bg-dark);
            color: var(--text-white); overflow: hidden; position: fixed;
            display: flex; justify-content: center; align-items: center;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        h1 { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; opacity: 0.8; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .swgoh-input { 
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px; color: #fff; font-size: 1.2rem;
            text-align: center; letter-spacing: 3px; outline: none;
        }

        /* НОВЫЙ БЛОК: Превью гильдии */
        .guild-preview {
            width: 100%;
            background: rgba(30, 58, 95, 0.3);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .guild-preview.show {
            opacity: 1;
            transform: translateY(0);
        }

        .guild-info-left { display: flex; align-items: center; gap: 12px; text-align: left; }
        .guild-logo-mini { width: 40px; height: 40px; border-radius: 4px; border: 1px solid var(--accent-blue); }
        .guild-name-mini { font-weight: 700; font-size: 0.85rem; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .guild-count { font-size: 0.75rem; color: var(--accent-blue); font-weight: 700; }

        .submit-btn {
            position: relative; width: 100%; padding: 20px;
            font-family: 'Montserrat', sans-serif; font-weight: 700;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease;
            letter-spacing: 2px; cursor: not-allowed;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }

        .tg-login { margin-top: 20px; font-size: 0.8rem; }
        .tg-login a { color: var(--accent-blue); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    
    <h1>Авторизация</h1>
    <p class="description">Введи свой код союзника</p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-info-left">
            <img id="gIcon" src="https://swgoh.gg/static/img/assets/tex.guild_logo_default.png" class="guild-logo-mini">
            <div id="gName" class="guild-name-mini">Загрузка...</div>
        </div>
        <div id="gMembers" class="guild-count">0/50</div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>

    <div class="tg-login">
        Есть аккаунт? <a href="#">Войти с Telegram</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const preview = document.getElementById('guildPreview');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    async function checkInput() {
        input.value = formatValue(input.value);
        let pureDigits = input.value.replace(/\D/g, '');
        
        if (pureDigits.length === 9) {
            // Как только ввели 9 цифр — ищем гильдию
            fetchGuild(pureDigits);
        } else {
            preview.classList.remove('show');
            btn.classList.remove('active');
        }
    }

    async function fetchGuild(code) {
        // Мы обращаемся к твоему серверу на Render
        // Когда зальешь на Render, путь /api/guild/ заработает
        try {
            const response = await fetch(`/api/guild/${code}`);
            const data = await response.json();

            if (data.name) {
                document.getElementById('gName').innerText = data.name;
                document.getElementById('gMembers').innerText = `${data.members.length}/50`;
                // Если есть иконка в API, можно заменить src
                
                preview.classList.add('show');
                btn.classList.add('active');
            }
        } catch (err) {
            console.log("Гильдия пока не найдена или сервер спит");
        }
    }

    input.addEventListener('input', checkInput);
    
    btn.addEventListener('click', () => {
        if (btn.classList.contains('active')) {
            // Переход к списку энергии или сохранение
            alert("Вход выполнен!");
        }
    });
</script>

</body>
</html>
