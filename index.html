<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; z-index: 10; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        h1 { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: 0.9rem; margin-bottom: 25px; opacity: 0.9; }

        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 50px 0 18px; color: #ffffff;
            font-size: 1.2rem; outline: none; text-align: center; letter-spacing: 3px;
        }

        .paste-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; fill: rgba(255, 255, 255, 0.4); z-index: 10; display: flex; }

        .status-plate { display: none; align-items: center; padding: 0 15px; z-index: 5; }
        .loader-box { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
        .player-portrait { width: 100%; height: 100%; object-fit: cover; }

        .swgoh-spinner {
            width: 20px; height: 20px; border: 2px solid rgba(79, 172, 254, 0.1);
            border-top: 2px solid var(--accent-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-info-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px; align-items: center; text-align: center; }
        .status-info-wrapper.align-left { align-items: flex-start; text-align: left; }
        
        .player-rank-title { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .player-name-success { color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .player-gp-sub { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px; }

        .reset-icon { width: 24px; height: 24px; cursor: pointer; opacity: 0.6; filter: invert(1); }

        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif; font-weight: 700;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.3); border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease; letter-spacing: 2px; cursor: not-allowed;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark));
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }

        .disclaimer-bar {
            position: fixed; bottom: -300px; left: 0; width: 100%; background: #fff; color: #000;
            padding: 15px 20px; z-index: 1000; transition: bottom 0.6s ease;
        }
        .disclaimer-bar.active { bottom: 0; }
        .credits { font-size: 0.7rem; margin-top: 25px; color: rgba(255,255,255,0.4); }
        .credits a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

<div id="disclaimer" class="disclaimer-bar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <b style="font-size:0.8rem;">ОТКАЗ ОТ ОТВЕТСТВЕННОСТИ</b>
        <span id="closeDisclaimer" style="cursor:pointer; font-weight:bold; padding:5px;">✕</span>
    </div>
    <p style="font-size:0.7rem; margin-top:5px;">Информация легальна и открыта. <a href="Decline.txt">Подробнее.</a></p>
</div>

<div class="main-content">
    <img src="Logos/Logo.png" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи <b>код союзника</b> для авторизации.</p>

    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
            <div class="paste-icon" id="pasteBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
            </div>
        </div>

        <div id="statusPlate" class="status-plate">
            <div id="statusVisual" class="loader-box"></div>
            <div id="infoWrapper" class="status-info-wrapper">
                <span id="playerRank" class="player-rank-title"></span>
                <span id="statusText" class="player-name-success"></span>
                <span id="subText" class="player-gp-sub"></span>
            </div>
            <img src="https://img.icons8.com/ios-glyphs/30/ffffff/multiply.png" class="reset-icon" id="resetBtn">
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>

    <div class="credits">Заказ гильдии <b>Те, кто в тени</b>.<br>By <a href="https://t.me/tz_projects">@tz_projects</a></div>
</div>

<script>
    // ЗАМЕНИ НА ССЫЛКУ ОТ RENDER
    const myProxyUrl = 'https://твой-бэкенд.onrender.com/';

    const input = document.getElementById('allyCode');
    const inputContainer = document.getElementById('inputContainer');
    const statusPlate = document.getElementById('statusPlate');
    const statusText = document.getElementById('statusText');
    const playerRank = document.getElementById('playerRank');
    const statusVisual = document.getElementById('statusVisual');
    const infoWrapper = document.getElementById('infoWrapper');
    const subText = document.getElementById('subText');
    const btn = document.getElementById('submitBtn');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let res = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) res += "-";
            res += digits[i];
        }
        return res;
    }

    async function fetchData() {
        const code = input.value.replace(/\D/g, '');
        if (code.length !== 9) return;

        inputContainer.style.display = 'none';
        statusPlate.style.display = 'flex';
        statusVisual.innerHTML = '<div class="swgoh-spinner"></div>';
        statusText.innerText = 'ПОИСК...';

        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            const response = await fetch(`${myProxyUrl}?url=${encodeURIComponent(api)}`);
            const data = await response.json();
            const p = data.data || data;

            if (p && (p.name || p.username)) {
                statusVisual.innerHTML = `<img src="${p.portrait_image || 'https://game-assets.swgoh.gg/textures/tex.vanity_stormtrooper.png'}" class="player-portrait">`;
                infoWrapper.classList.add('align-left');
                statusText.innerText = (p.name || p.username).toUpperCase();
                
                let role = p.guild_rank === 4 ? "[ЛИДЕР] " : p.guild_rank === 3 ? "[ОФИЦЕР] " : "[УЧАСТНИК] ";
                playerRank.innerText = role + (p.guild_name || "БЕЗ ГИЛЬДИИ");
                subText.innerText = `ГМ: ${(p.galactic_power / 1000000).toFixed(2)}M • ${p.level || 85} LVL`;
                
                btn.classList.add('active');
                btn.disabled = false;
            } else { throw new Error(); }
        } catch (e) {
            statusText.innerText = "НЕ НАЙДЕН";
            playerRank.innerText = "ОШИБКА";
        }
    }

    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        if (input.value.replace(/\D/g, '').length === 9) fetchData();
    });

    document.getElementById('resetBtn').onclick = () => {
        statusPlate.style.display = 'none';
        inputContainer.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
    };

    document.getElementById('pasteBtn').onclick = async () => {
        const text = await navigator.clipboard.readText();
        input.value = formatValue(text);
        if (input.value.replace(/\D/g, '').length === 9) fetchData();
    };

    window.onload = () => setTimeout(() => document.getElementById('disclaimer').classList.add('active'), 1000);
    document.getElementById('closeDisclaimer').onclick = () => document.getElementById('disclaimer').classList.remove('active');
</script>
</body>
</html>
