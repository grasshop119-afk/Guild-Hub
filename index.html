<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new window.VConsole();</script>

    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }
        .main-content { text-align: center; width: 90%; max-width: 360px; z-index: 10; }
        .interactive-area { position: relative; width: 100%; height: 62px; margin: 20px 0; }
        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
        }
        .swgoh-input {
            padding: 0 18px; color: #ffffff; font-size: 1.2rem;
            outline: none; text-align: center; letter-spacing: 3px;
        }
        .status-plate { display: none; align-items: center; padding: 0 15px; }
        .player-name-success { color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; font-weight: bold; }
        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: 0.3s;
        }
        .submit-btn.active {
            background: linear-gradient(to top, #26b31e 0%, #0f400b 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-content">
    <h1>Добро пожаловать!</h1>
    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        </div>

        <div id="statusPlate" class="status-plate">
            <div style="flex-grow: 1; text-align: left;">
                <span id="playerRank" style="font-size: 0.6rem; opacity: 0.6; display: block;">ИГРОК</span>
                <span id="statusText" class="player-name-success">Загрузка...</span>
            </div>
            <div id="resetBtn" style="cursor: pointer; font-size: 1.2rem;">✕</div>
        </div>
    </div>
    <button id="submitBtn" class="submit-btn">Продолжить</button>
</div>

<script>
    const input = document.getElementById('allyCode');
    const inputContainer = document.getElementById('inputContainer');
    const statusPlate = document.getElementById('statusPlate');
    const statusText = document.getElementById('statusText');
    const btn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Форматирование ввода
    input.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < val.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += val[i];
        }
        e.target.value = formatted;
        if (val.length === 9) startSearch(val);
    });

    async function startSearch(pureCode) {
        inputContainer.style.display = 'none';
        statusPlate.style.display = 'flex';
        statusText.innerText = 'ПОИСК...';

        try {
            // ИСПОЛЬЗУЕМ ОТНОСИТЕЛЬНЫЙ ПУТЬ БЕЗ ТОЧЕК И ДОМЕНОВ
            const response = await fetch('/api/player/' + pureCode);
            
            if (!response.ok) throw new Error("Не найден");

            const data = await response.json();
            statusText.innerText = data.name;
            document.getElementById('playerRank').innerText = data.title || "ИГРОК";
            btn.classList.add('active');
        } catch (e) {
            console.error("Ошибка поиска:", e);
            statusText.innerText = "ОШИБКА / НЕ НАЙДЕН";
            btn.classList.remove('active');
        }
    }

    resetBtn.addEventListener('click', () => {
        statusPlate.style.display = 'none';
        inputContainer.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
    });
</script>
</body>
</html>
