<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Render Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #3390ec;
            --tg-theme-secondary-bg-color: #f0f2f5;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 400px; text-align: center; }

        input {
            width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #ddd;
            margin-bottom: 15px; font-size: 17px; text-align: center; box-sizing: border-box;
            outline: none;
        }

        /* Кнопка: не темнеет */
        .btn-main {
            width: 100%; padding: 16px;
            background-color: var(--tg-theme-button-color) !important;
            color: #ffffff !important; border: none; border-radius: 15px;
            font-size: 17px; font-weight: bold; cursor: pointer;
            -webkit-tap-highlight-color: transparent; transition: none !important;
        }
        .btn-main:active { opacity: 1 !important; }

        .card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 20px; padding: 20px; margin-top: 20px;
            display: none; border: 1px solid rgba(0,0,0,0.05); text-align: left;
        }

        .stat-box {
            background: #fff; padding: 12px; border-radius: 12px;
            display: flex; justify-content: space-between; margin-bottom: 8px;
        }
        .label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        .val { font-size: 16px; font-weight: 800; color: #222; }

        .loader { display: none; margin-top: 20px; color: var(--tg-theme-button-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-bottom: 20px;">SWGOH Анализ (Render)</h2>
        <input type="number" id="allyCode" placeholder="Код союзника" inputmode="numeric">
        <button class="btn-main" onclick="fetchThroughRender()">ПОЛУЧИТЬ ДАННЫЕ</button>

        <div id="loader" class="loader">Запрос через Render мост...</div>

        <div id="result" class="card">
            <div id="pName" style="font-size: 26px; font-weight: 900; color: var(--tg-theme-button-color); text-align: center; margin-bottom: 15px;"></div>
            
            <div class="stat-box"><span class="label">Реликты (R1+)</span><span id="pRelics" class="val">-</span></div>
            <div class="stat-box"><span class="label">Купоны</span><span id="pTix" class="val">- / 600</span></div>
            <div class="stat-box"><span class="label">Открыто юнитов</span><span id="pUnits" class="val">-</span></div>
            <div class="stat-box"><span class="label">Мощность ГМ</span><span id="pGP" class="val">-</span></div>

            <div style="margin-top: 15px; padding: 10px; background: #fff; border-radius: 10px;">
                <b style="font-size: 11px; color: #3390ec;">ГИЛЬДИЯ:</b><br>
                <span id="pGuild" style="font-weight: 800;"></span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchThroughRender() {
            const ally = document.getElementById('allyCode').value.trim();
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            
            if (ally.length < 9) return;

            loader.style.display = "block";
            result.style.display = "none";

            // МЫ ПРОБУЕМ ТВОЙ RENDER КАК ПРОКСИ
            // Если на твоем Render стоит стандартный CORS Anywhere или аналогичный прокси
            const renderProxy = "https://guild-hub-y1vg.onrender.com/";
            const targetUrl = `https://swgoh.gg/api/player/${ally}/`;

            try {
                // Попытка №1: Через твой Render
                const response = await fetch(renderProxy + targetUrl);
                const data = await response.json();
                
                const p = data.data;
                if (p) {
                    renderPlayer(p);
                } else {
                    throw new Error("No data");
                }

            } catch (e) {
                console.log("Render proxy error, fallback to public...");
                // Если твой Render не настроен как прокси, используем запасной вариант
                try {
                    const altResp = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                    const altJson = await altResp.json();
                    const altData = JSON.parse(altJson.contents).data;
                    if (altData) renderPlayer(altData);
                } catch (e2) {
                    loader.innerText = "Ошибка доступа. Проверьте настройки Render.";
                }
            }
        }

        function renderPlayer(d) {
            document.getElementById('pName').innerText = d.name;
            document.getElementById('pGP').innerText = (d.galactic_power / 1000000).toFixed(2) + "M";
            document.getElementById('pGuild').innerText = d.guild_name || "---";

            // Реликты
            let relics = 0;
            if (d.units && Array.isArray(d.units)) {
                relics = d.units.filter(u => u.data && u.data.relic_tier > 2).length;
                document.getElementById('pUnits').innerText = d.units.length;
            } else {
                document.getElementById('pUnits').innerText = "N/A";
            }
            document.getElementById('pRelics').innerText = relics;

            // Купоны
            document.getElementById('pTix').innerText = (d.daily_raid_tickets || 0) + " / 600";

            document.getElementById('loader').style.display = "none";
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
