<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex; justify-content: center; align-items: center;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; }

        .swgoh-input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px; color: #ffffff; font-size: 1.1rem;
            outline: none; box-sizing: border-box; text-align: center; margin-bottom: 20px;
        }

        .guild-preview {
            display: none; background: rgba(15, 27, 42, 0.9); border: 1px solid var(--accent-blue);
            border-radius: 8px; margin-bottom: 15px; padding: 12px; align-items: center;
        }

        .guild-info { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        
        .guild-icon { width: 40px; height: 40px; margin-right: 12px; font-size: 24px; display: flex; align-items: center; }

        .submit-btn {
            width: 100%; padding: 20px; font-weight: 700; text-transform: uppercase;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }

        .submit-btn.active {
            background: linear-gradient(to top, #26b31e 0%, #0f400b 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-content">
    <h1>Guild Hub</h1>
    <input type="number" id="allyCode" class="swgoh-input" placeholder="Код союзника">

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon" id="gIcon">⏳</div>
        <div class="guild-info">
            <span id="gName" style="font-weight:700; color: #4facfe;">Поиск...</span>
            <span id="gCount" style="font-size: 0.8rem; opacity: 0.7;"></span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const preview = document.getElementById('guildPreview');
    const gName = document.getElementById('gName');
    const gCount = document.getElementById('gCount');
    const gIcon = document.getElementById('gIcon');

    async function checkGuild(code) {
        preview.style.display = 'flex';
        gName.innerText = 'Поиск...';
        gCount.innerText = '';
        gIcon.innerText = '⏳';

        try {
            // Запрос идет к твоему серверу на Render
            const res = await fetch(`/api/guild/${code}`);
            const data = await res.json();

            if (data.name) {
                gName.innerText = data.name;
                gCount.innerText = `${data.members.length}/50`;
                gIcon.innerHTML = `<img src="https://swgoh.gg/static/img/assets/tex.guild_avatar_mon_calamari_01.png" width="40">`;
                btn.classList.add('active');
            } else {
                throw new Error();
            }
        } catch (e) {
            gName.innerText = 'Гильдия не найдена';
            gIcon.innerText = '🤔';
            gCount.innerText = '';
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', () => {
        if (input.value.length === 9) {
            checkGuild(input.value);
        } else {
            preview.style.display = 'none';
            btn.classList.remove('active');
        }
    });
</script>

</body>
</html>
