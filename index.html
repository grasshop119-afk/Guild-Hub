<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGOH Scanner</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: white; width: 160px; margin-bottom: 10px; font-size: 16px; }
        button { padding: 12px 25px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        #player-card { 
            background: #1e1e1e; padding: 25px; border-radius: 20px; display: none; 
            border: 1px solid #333; width: 100%; max-width: 350px; text-align: center; margin-top: 20px;
        }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #edb219; }
        .share-btn { background: #28a745; width: 100%; margin-top: 20px; padding: 10px; border-radius: 8px; color: white; border: none; font-weight: bold; }
        .share-btn:hover { background: #28a745 !important; opacity: 0.9; }
        #log { font-size: 10px; color: #555; margin-top: 10px; max-width: 300px; text-align: center; }
    </style>
</head>
<body>

    <h2>SWGOH SCANNER</h2>
    
    <input type="tel" id="allyCode" placeholder="Код союзника" maxlength="9">
    <button onclick="fetchPlayer()">НАЙТИ</button>

    <div id="status" style="margin-top: 15px; color: #edb219;"></div>
    <div id="log"></div>

    <div id="player-card">
        <img id="p-avatar" class="avatar" src="">
        <h2 id="p-name"></h2>
        <div id="p-gm" style="color: #edb219; font-weight: bold; margin-bottom: 10px;"></div>
        <div id="g-name" style="color: #4db8ff;"></div>
        <button class="share-btn">ПОДЕЛИТЬСЯ</button>
    </div>

    <script>
        async function fetchPlayer() {
            const code = document.getElementById('allyCode').value.replace(/\D/g, '');
            const card = document.getElementById('player-card');
            const status = document.getElementById('status');
            const log = document.getElementById('log');

            if (code.length < 9) return alert('9 цифр!');

            card.style.display = 'none';
            status.textContent = "Поиск в Голонете...";
            log.textContent = "";

            // Список прокси (твой воркер + публичный)
            const targets = [
                `https://swgoh-auth.grasshop119.workers.dev/?allyCode=${code}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent('https://swgoh.gg/api/player/' + code + '/')}`
            ];

            for (let url of targets) {
                try {
                    log.textContent += `Пробую: ${url.split('/')[2]}... `;
                    const response = await fetch(url);
                    if (!response.ok) continue;

                    let result = await response.json();
                    
                    // Если используем allorigins, данные лежат в .contents
                    if (result.contents) {
                        result = JSON.parse(result.contents);
                    }

                    const p = result.data || result;
                    if (!p.name) continue;

                    // Отрисовка
                    document.getElementById('p-avatar').src = `https://game-assets.swgoh.gg/tex.charui_portrait_${p.portrait_id}.png`;
                    document.getElementById('p-name').textContent = p.name;
                    document.getElementById('p-gm').textContent = `ГМ: ${p.galactic_power.toLocaleString()}`;
                    document.getElementById('g-name').textContent = p.guild_name;

                    card.style.display = 'block';
                    status.textContent = "";
                    return; // Успех! Выходим из цикла.
                } catch (e) {
                    log.textContent += "ошибка. ";
                }
            }
            status.textContent = "Все прокси заблокированы. Попробуй сменить сеть.";
        }
    </script>
</body>
</html>
