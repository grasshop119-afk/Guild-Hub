<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050b14; --blue: #4facfe; --green: #26b31e; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Roboto', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 360px; text-align: center; }
        .logo { width: 180px; margin-bottom: 20px; }
        .input-box { position: relative; height: 60px; margin-bottom: 20px; }
        input, .plate { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(79,172,254,0.3); border-radius: 8px; color: white; text-align: center; font-size: 1.2rem; outline: none; }
        .plate { display: none; align-items: center; padding: 0 10px; text-align: left; position: absolute; top: 0; left: 0; background: #0a1626; }
        .avatar { width: 40px; height: 40px; border-radius: 4px; background: #222; margin-right: 10px; }
        .info { flex-grow: 1; overflow: hidden; }
        .info b { display: block; color: var(--blue); text-transform: uppercase; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info span { font-size: 0.7rem; opacity: 0.6; }
        .btn { width: 100%; padding: 18px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); font-family: 'Montserrat'; font-weight: 700; text-transform: uppercase; cursor: not-allowed; transition: 0.3s; }
        .btn.active { background: linear-gradient(to top, var(--green), #0f400b); color: white; cursor: pointer; border: 1px solid #45f53d; }
        .reset { cursor: pointer; opacity: 0.5; font-size: 1.2rem; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <img src="Logos/Logo.png" class="logo">
    <div class="input-box">
        <input type="text" id="code" placeholder="Код союзника" maxlength="11">
        <div id="plate" class="plate">
            <img id="p-img" class="avatar" src="">
            <div class="info">
                <b id="p-name">Загрузка...</b>
                <span id="p-desc">Синхронизация данных</span>
            </div>
            <div id="reset" class="reset">✕</div>
        </div>
    </div>
    <button id="btn" class="btn">Продолжить</button>
</div>

<script>
    const WORKER = 'https://swgoh-auth.grasshop119.workers.dev/';
    const input = document.getElementById('code');
    const plate = document.getElementById('plate');
    const btn = document.getElementById('btn');

    input.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
        if (v.length === 9) load(v);
    };

    async function load(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        
        try {
            const url = `https://swgoh.gg/api/player/${code}/`;
            const res = await fetch(`${WORKER}?url=${encodeURIComponent(url)}`);
            const json = await res.json();
            
            // Берем данные напрямую из структуры, которую ты прислал на скрине
            const p = json.data; 

            if (p && p.name) {
                document.getElementById('p-name').innerText = p.name;
                document.getElementById('p-img').src = p.portrait_image || 'Logos/NoShield.png';
                document.getElementById('p-desc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M • ${p.level} LVL`;
                
                btn.classList.add('active');
                btn.disabled = false;
            } else {
                throw "error";
            }
        } catch (e) {
            document.getElementById('p-name').innerText = "Не найден";
            document.getElementById('p-desc').innerText = "Профиль отсутствует в базе";
            document.getElementById('p-img').src = 'Logos/NoShield.png';
        }
    }

    document.getElementById('reset').onclick = () => {
        plate.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
        btn.disabled = true;
    };
</script>

</body>
</html>
