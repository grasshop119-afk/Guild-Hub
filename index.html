<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; z-index: 10; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        .interactive-area { position: relative; width: 100%; height: 62px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 50px 0 18px; color: #ffffff;
            font-family: 'Montserrat', sans-serif; font-size: 1.1rem;
            text-align: center; letter-spacing: 3px;
        }

        .status-plate { display: none; align-items: center; justify-content: space-between; padding: 0 15px; }
        
        .swgoh-spinner {
            width: 22px; height: 22px; border: 2px solid rgba(79, 172, 254, 0.1);
            border-top: 2px solid var(--accent-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .guild-icon-img { width: 32px; height: 32px; object-fit: contain; }
        
        .status-info-wrapper { flex-grow: 1; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .status-text { font-size: 0.9rem; color: #ffffff; white-space: nowrap; }
        .guild-name-success { color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; }
        .members-count { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px; }

        .submit-btn {
            width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: 0.3s;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark)) !important;
            border: 1px solid #45f53d !important; color: #ffffff !important; cursor: pointer;
        }

        /* Защита от потемнения на iOS */
        .submit-btn.active:active, .submit-btn.active:focus {
            filter: brightness(1) !important;
            background: linear-gradient(to top, var(--swgoh-green-bright), var(--swgoh-green-dark)) !important;
        }

        .reset-icon { cursor: pointer; opacity: 0.6; padding: 5px; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" alt="Logo" class="logo">
    <div class="interactive-area">
        <div id="inputContainer">
            <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        </div>

        <div id="statusPlate" class="status-plate">
            <div id="statusVisual"><div class="swgoh-spinner"></div></div>
            <div class="status-info-wrapper">
                <span id="statusText">Поиск...</span>
                <span id="membersCount"></span>
            </div>
            <div class="reset-icon" id="resetBtn">❌</div>
        </div>
    </div>
    <button id="submitBtn" class="submit-btn">Продолжить</button>
</div>

<script>
    const input = document.getElementById('allyCode');
    const statusPlate = document.getElementById('statusPlate');
    const statusText = document.getElementById('statusText');
    const statusVisual = document.getElementById('statusVisual');
    const membersCount = document.getElementById('membersCount');
    const btn = document.getElementById('submitBtn');

    // Трюк для iOS: используем JSONP-подобный подход через AllOrigins, 
    // который Safari считает обычным скриптом, а не опасным запросом.
    async function fetchIOSFriendly(url) {
        try {
            // Используем AllOrigins, но с добавлением случайного параметра, чтобы обойти кэш Safari
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}&callback=?`);
            const text = await res.text();
            // AllOrigins при callback=? возвращает строку вида "/**/ typeof ... === 'function' && ...({ contents: "..." })"
            // Нам нужно вытащить оттуда содержимое contents
            const match = text.match(/\"contents\":\"(.*?)\"}/);
            if (match) {
                const cleanJson = JSON.parse(match[1].replace(/\\"/g, '"').replace(/\\n/g, ''));
                return cleanJson;
            }
            // Если JSONP не сработал, пробуем обычный метод, но через прокси Codetabs (он чище для iOS)
            const fallback = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`);
            return await fallback.json();
        } catch (e) {
            return null;
        }
    }

    async function startSearch() {
        const code = input.value.replace(/\D/g, '');
        if (code.length !== 9) return;

        document.getElementById('inputContainer').style.display = 'none';
        statusPlate.style.display = 'flex';

        // Запрос данных
        const pDataRaw = await fetchIOSFriendly(`https://swgoh.gg/api/player/${code}/`);
        const pData = pDataRaw?.data || pDataRaw;

        if (pData && pData.guild_id) {
            renderSuccess(pData.guild_name, pData.galactic_power);
            
            // Запрос гильдии
            const gDataRaw = await fetchIOSFriendly(`https://swgoh.gg/api/guild-profile/${pData.guild_id}/`);
            const gData = gDataRaw?.data || gDataRaw;
            if (gData) {
                const count = Array.isArray(gData.members) ? gData.members.length : (gData.member_count || "?");
                membersCount.innerText = `ГМ: ${(pData.galactic_power / 1000000).toFixed(2)}M • ${count}/50`;
            }
        } else {
            statusText.innerText = "Ошибка";
            statusVisual.innerText = "⚠️";
        }
    }

    function renderSuccess(name, gp) {
        statusText.innerText = name;
        statusText.classList.add('guild-name-success');
        membersCount.innerText = `ГМ: ${(gp / 1000000).toFixed(2)}M`;
        
        let shield = (name === "Those who are in the shadows") ? "ShadeShield.png" : "NoShield.png";
        statusVisual.innerHTML = `<img class="guild-icon-img" src="Logos/${shield}" onerror="this.src='https://img.icons8.com/ios-filled/50/4facfe/shield.png'">`;
        
        btn.classList.add('active');
    }

    input.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').substring(0, 9);
        let r = "";
        for (let i = 0; i < v.length; i++) {
            if (i > 0 && i % 3 === 0) r += "-";
            r += v[i];
        }
        e.target.value = r;
        if (v.length === 9) startSearch();
    });

    document.getElementById('resetBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
