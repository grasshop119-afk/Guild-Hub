<script>
    // Поменяли путь на этот — он работает на Vercel без конфигов
    const PROXY = window.location.origin + '/api?url='; 
    const input = document.getElementById('code');
    const plate = document.getElementById('statusPlate');
    const btn = document.getElementById('submitBtn');
    let playerData = null;

    input.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
        if (v.length === 9) { input.blur(); load(v); }
    };

    async function load(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        document.getElementById('p-name').innerText = "Поиск...";
        document.getElementById('v-box').innerHTML = '<div class="loader"></div>';
        
        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            // Кодируем URL, чтобы Vercel его правильно проглотил
            const res = await fetch(`${PROXY}${encodeURIComponent(api)}`);
            
            if (!res.ok) throw new Error("Server error");
            
            const data = await res.json();
            const p = data.data || data;

            if (p && p.name) {
                playerData = p;
                document.getElementById('v-box').innerHTML = `<img src="${p.portrait_image}" class="avatar" onerror="this.src='Logos/NoShield.png'">`;
                document.getElementById('p-name').innerText = p.name;
                document.getElementById('p-desc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M • ${p.level} LVL`;
                btn.classList.add('active');
                btn.disabled = false;
            } else { throw "NotFound"; }
        } catch (e) {
            console.error(e);
            document.getElementById('v-box').innerHTML = `<img src="Logos/NoShield.png" class="avatar">`;
            document.getElementById('p-name').innerText = "Не найден";
            document.getElementById('p-desc').innerText = "Попробуйте позже";
        }
    }

    btn.onclick = () => {
        if (playerData) {
            localStorage.setItem('swgoh_player_data', JSON.stringify(playerData));
            window.location.href = 'profile.html';
        }
    };

    document.getElementById('resetBtn').onclick = () => {
        plate.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        btn.classList.remove('active');
        btn.disabled = true;
    };
</script>
