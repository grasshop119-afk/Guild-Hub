<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite</title>
    
    <link rel="icon" type="image/jpeg" href="Guild_WEB_Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green: #26b31e;
            --text-white: #ffffff;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0; font-family: 'Roboto', sans-serif;
            background: var(--bg-dark); color: var(--text-white);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; }
        .logo { width: 180px; margin-bottom: 25px; }
        
        .interactive-area { position: relative; width: 100%; height: 75px; margin-bottom: 20px; }

        .swgoh-input, .status-plate {
            width: 100%; height: 100%; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(79,172,254,0.3); border-radius: 8px;
            position: absolute; top: 0; left: 0;
        }

        .swgoh-input {
            padding: 0 15px; color: #fff; font-size: 1.2rem;
            outline: none; text-align: center; letter-spacing: 3px;
        }

        .status-plate { display: none; align-items: center; padding: 0 12px; background: #0a1626; z-index: 5; }
        .avatar-container { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; background: #1a2a3a; border: 1px solid var(--accent-blue); }

        .info { flex-grow: 1; text-align: left; padding: 0 12px; overflow: hidden; }
        .info b { display: block; color: var(--accent-blue); font-size: 0.95rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info span { font-size: 0.75rem; opacity: 0.7; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .guild-line { color: var(--swgoh-green) !important; font-weight: bold; opacity: 1 !important; margin-top: 2px; }

        .reset-btn { cursor: pointer; opacity: 0.6; filter: invert(1); width: 18px; transition: 0.2s; }
        .reset-btn:hover { opacity: 1; }

        .submit-btn {
            width: 100%; padding: 18px; font-family: 'Montserrat', sans-serif; font-weight: 700;
            text-transform: uppercase; color: rgba(255,255,255,0.3); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
            cursor: not-allowed; transition: 0.3s; margin-bottom: 10px;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green), #0f400b);
            border: 1px solid #45f53d; color: #fff; cursor: pointer;
        }

        /* Кнопка просмотра склада */
        .inventory-link {
            display: none; width: 100%; text-decoration: none; color: var(--accent-blue);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 10px; border-bottom: 1px solid transparent; width: fit-content; margin-left: auto; margin-right: auto;
        }
        .inventory-link.visible { display: block; }

        /* Защита от затемнения кнопок */
        .submit-btn.active:hover { filter: none !important; opacity: 1 !important; }

        .loader { width: 24px; height: 24px; border: 2px solid rgba(79,172,254,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 13px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" class="logo">
    
    <div class="interactive-area">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
        
        <div id="statusPlate" class="status-plate">
            <div id="avatarBox" class="avatar-container"><div class="loader"></div></div>
            <div class="info">
                <b id="pName">Загрузка...</b>
                <span id="pDesc">Синхронизация</span>
                <span id="pGuild" class="guild-line"></span>
            </div>
            <img src="https://img.icons8.com/?size=100&id=95867&format=png" class="reset-btn" id="resetBtn">
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>
    <a id="inventoryBtn" href="#" target="_blank" class="inventory-link">Просмотреть склад ➔</a>
</div>

<script>
    const WORKER_URL = 'https://swgoh-auth.grasshop119.workers.dev/';
    const input = document.getElementById('allyCode');
    const plate = document.getElementById('statusPlate');
    const submitBtn = document.getElementById('submitBtn');
    const inventoryBtn = document.getElementById('inventoryBtn');

    input.oninput = (e) => {
        let val = e.target.value.replace(/\D/g, '').substring(0, 9);
        e.target.value = val.replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3').replace(/-$/, '');
        if (val.length === 9) performSearch(val);
    };

    async function performSearch(code) {
        input.style.display = 'none';
        plate.style.display = 'flex';
        
        try {
            const api = `https://swgoh.gg/api/player/${code}/`;
            const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(api)}`);
            const json = await response.json();
            
            const p = json.data || json;

            if (p && p.name) {
                // Устанавливаем портрет игрока (или заглушку)
                const portrait = p.portrait_image || 'Logos/NoShield.png';
                document.getElementById('avatarBox').innerHTML = `<img src="${portrait}" class="avatar" onerror="this.src='Logos/NoShield.png'">`;
                
                document.getElementById('pName').innerText = p.name;
                document.getElementById('pDesc').innerText = `ГМ: ${(p.galactic_power/1000000).toFixed(2)}M • ${p.level} LVL`;
                
                // Отображение гильдии
                const guildName = p.guild_name || "Без гильдии";
                document.getElementById('pGuild').innerText = guildName;

                // Ссылка на склад (на swgoh.gg персонажи находятся по адресу профиля)
                inventoryBtn.href = `https://swgoh.gg/p/${code}/characters/`;
                inventoryBtn.classList.add('visible');
                
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                throw "empty";
            }
        } catch (e) {
            document.getElementById('avatarBox').innerHTML = `<img src="Logos/NoShield.png" class="avatar">`;
            document.getElementById('pName').innerText = "Не найден";
            document.getElementById('pDesc').innerText = "Проверьте код союзника";
            document.getElementById('pGuild').innerText = "";
            inventoryBtn.classList.remove('visible');
        }
    }

    document.getElementById('resetBtn').onclick = () => {
        plate.style.display = 'none';
        input.style.display = 'block';
        input.value = '';
        submitBtn.classList.remove('active');
        submitBtn.disabled = true;
        inventoryBtn.classList.remove('visible');
        document.getElementById('pGuild').innerText = "";
    };
</script>

</body>
</html>
