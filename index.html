<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-white);
            overflow: hidden;
            position: fixed;
        }

        .main-content {
            text-align: center;
            width: 90%;
            max-width: 360px;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            width: 70%;
            max-width: 240px;
            margin: 0 auto 25px;
            display: block;
        }

        h1 {
            font-size: clamp(1.2rem, 5vw, 1.4rem);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
        }

        .description {
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .swgoh-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 18px 50px 18px 18px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.2rem);
            outline: none;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 3px;
            -webkit-appearance: none;
            appearance: none;
        }

        .paste-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            fill: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            pointer-events: auto;
            padding: 8px;
            touch-action: manipulation;
        }

        /* --- НОВЫЙ БЛОК ГИЛЬДИИ --- */
        .guild-preview {
            display: none; /* Скрыт по умолчанию */
            background: rgba(15, 27, 42, 0.9);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 12px;
            align-items: center;
            text-align: left;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guild-icon {
            width: 45px;
            height: 45px;
            background: #1a2a3a;
            border-radius: 6px;
            margin-right: 12px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .guild-info-text {
            flex-grow: 1;
        }

        .guild-name-display {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-blue);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .guild-members-count {
            display: block;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        /* -------------------------- */

        .submit-btn {
            position: relative;
            width: 100%;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            margin-bottom: 20px;
            overflow: hidden;
            font-size: clamp(0.9rem, 4vw, 1rem);
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d;
            color: #ffffff;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Share кнопка (по инструкции не темнеет) */
        .share-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }
        .share-btn:hover, .share-btn:active, .share-btn:focus { 
            background: var(--accent-blue) !important; 
            filter: none !important; 
            opacity: 1 !important;
        }

        .glow-line {
            position: absolute;
            bottom: -1.5px;
            left: 50%;
            width: 70%;
            height: 3px;
            background: radial-gradient(circle, #ffffff 0%, #ffffff 20%, transparent 80%);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            filter: blur(0.5px);
        }

        .submit-btn.active:hover .glow-line,
        .submit-btn.active:active .glow-line {
            opacity: 1;
        }

        .tg-login {
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            padding: 0 10px;
        }

        .tg-login a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-height: 600px) {
            .main-content { padding: 10px; }
            .logo { margin-bottom: 15px; width: 60%; }
            .description { margin-bottom: 15px; }
            .submit-btn { padding: 16px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой <b>код союзника</b> для авторизации.</p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        <div class="paste-icon" id="pasteBtn" title="Вставить">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
            </svg>
        </div>
    </div>

    <div id="guildPreview" class="guild-preview">
        <img id="guildImg" src="https://swgoh.gg/static/img/assets/tex.guild_avatar_mon_calamari_01.png" class="guild-icon">
        <div class="guild-info-text">
            <span id="guildNameDisplay" class="guild-name-display">Загрузка...</span>
            <span id="guildMembersCount" class="guild-members-count">Участников: --</span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить
        <div class="glow-line"></div>
    </button>

    <div class="tg-login">
        Есть аккаунт? <a href="#">Войти с Telegram</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const guildPreview = document.getElementById('guildPreview');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    async function findGuild(code) {
        guildPreview.style.display = 'flex';
        document.getElementById('guildNameDisplay').innerText = 'Поиск гильдии...';
        
        try {
            // Запрос к твоему серверу на Render
            const response = await fetch(`/api/guild/${code}`);
            const data = await response.json();

            if (data.name) {
                document.getElementById('guildNameDisplay').innerText = data.name;
                document.getElementById('guildMembersCount').innerText = `Участников: ${data.members.length}/50`;
                // Если есть иконка в API, можно подставить её
                btn.classList.add('active');
            } else {
                throw new Error();
            }
        } catch (err) {
            document.getElementById('guildNameDisplay').innerText = 'Гильдия не найдена';
            btn.classList.remove('active');
        }
    }

    function checkInput() {
        input.value = formatValue(input.value);
        let pureDigits = input.value.replace(/\D/g, '');
        
        if (pureDigits.length === 9) {
            findGuild(pureDigits);
        } else {
            guildPreview.style.display = 'none';
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', checkInput);

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = text;
            checkInput();
            input.focus();
        } catch (err) {
            console.error('Ошибка доступа к буферу обмена');
        }
    });

    btn.addEventListener('click', () => {
        if (!btn.classList.contains('active')) return;
        alert('Вход выполнен!');
    });

    setTimeout(() => input.focus(), 300);
</script>

</body>
</html>
