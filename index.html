<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        /* Системный шрифт для всего, кроме заголовка */
        * { 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        
        /* Только этот шрифт Montserrat */
        h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(1.2rem, 5vw, 1.4rem); 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            letter-spacing: 1.5px; 
        }
        
        .description { font-size: clamp(0.8rem, 3.5vw, 0.9rem); margin-bottom: 25px; opacity: 0.9; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        
        .swgoh-input, .guild-preview {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px;
        }

        .swgoh-input {
            padding: 18px 50px 18px 18px; color: #ffffff;
            font-size: clamp(1.1rem, 4vw, 1.2rem);
            outline: none; text-align: center; letter-spacing: 3px;
        }

        .paste-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; fill: rgba(255, 255, 255, 0.4); display: flex; align-items: center; padding: 8px;
        }

        /* Плашка гильдии в стиле инпута */
        .guild-preview {
            display: none; margin-bottom: 15px; padding: 12px; align-items: center;
        }
        
        .guild-icon-box {
            width: 40px; height: 40px; margin-right: 12px; flex-shrink: 0; 
            display: flex; align-items: center; justify-content: center;
        }
        .guild-icon-img { width: 100%; height: 100%; object-fit: contain; }
        
        .guild-info { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .guild-name-display { font-weight: 700; font-size: 0.9rem; color: var(--accent-blue); }
        .guild-members-count { font-size: 0.8rem; opacity: 0.7; }

        .submit-btn {
            position: relative; width: 100%; padding: 20px;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; letter-spacing: 2px;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
        }

        .credits { font-size: 0.85rem; margin-top: 25px; color: rgba(255,255,255,0.6); }
        .credits a { color: var(--accent-blue); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="Logos/Logo.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой код союзника для авторизации.</p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        <div class="paste-icon" id="pasteBtn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
        </div>
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon-box" id="gIconBox">
            <img src="Logos/Guild_Logo.png" class="guild-icon-img" id="gImg" style="display:none;">
            <span id="gStatus"></span>
        </div>
        <div class="guild-info">
            <span id="gName" class="guild-name-display">Поиск...</span>
            <span id="gCount" class="guild-members-count"></span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить</button>

    <div class="credits">
        Создан <a href="https://t.me/temkazavr" target="_blank">@temkazavr</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const preview = document.getElementById('guildPreview');
    const gName = document.getElementById('gName');
    const gCount = document.getElementById('gCount');
    const gImg = document.getElementById('gImg');
    const gStatus = document.getElementById('gStatus');
    const pasteBtn = document.getElementById('pasteBtn');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    async function checkGuild(code) {
        preview.style.display = 'flex';
        gName.innerText = 'Поиск...';
        gCount.innerText = '';
        gImg.style.display = 'none';
        gStatus.innerText = '⏳';
        btn.classList.remove('active');

        try {
            // Используем логику через AllOrigins / CORSProxy
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://swgoh.gg/api/player/' + code + '/')}`;
            const response = await fetch(url);
            const json = await response.json();
            
            if (json.contents) {
                const pData = JSON.parse(json.contents).data;
                const gId = pData.guild_id;

                const gResp = await fetch(`https://corsproxy.io/?${encodeURIComponent('https://swgoh.gg/api/guild-profile/' + gId + '/')}`);
                const gData = await gResp.json();

                if (gData && gData.data) {
                    gName.innerText = gData.data.name;
                    gCount.innerText = `${gData.data.members.length}/50`;
                    gImg.style.display = 'block';
                    gStatus.innerText = '';
                    btn.classList.add('active');
                } else throw new Error();
            } else throw new Error();
        } catch (e) {
            gName.innerText = 'Гильдия не найдена';
            gStatus.innerText = '🤔';
            gImg.style.display = 'none';
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        let pureDigits = input.value.replace(/\D/g, '');
        if (pureDigits.length === 9) {
            checkGuild(pureDigits);
        } else {
            preview.style.display = 'none';
            btn.classList.remove('active');
        }
    });

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = text;
            input.dispatchEvent(new Event('input'));
        } catch (err) {}
    });
</script>

</body>
</html>
