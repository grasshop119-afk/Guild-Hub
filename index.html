<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub - Elite Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --swgoh-green-bright: #26b31e;
            --swgoh-green-dark: #0f400b;
            --text-white: #ffffff;
            --border-default: rgba(30, 58, 95, 0.8);
            --input-bg: rgba(5, 13, 22, 0.8);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            background-size: 100% 3px, cover;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-white); overflow: hidden; position: fixed;
        }

        .main-content { text-align: center; width: 90%; max-width: 360px; padding: 20px; box-sizing: border-box; }
        .logo { width: 70%; max-width: 240px; margin: 0 auto 25px; display: block; }
        h1 { font-size: clamp(1.2rem, 5vw, 1.4rem); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; }
        .description { font-size: clamp(0.8rem, 3.5vw, 0.9rem); margin-bottom: 25px; padding: 0 10px; }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 20px; }
        .swgoh-input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-default);
            border-radius: 8px; padding: 18px 50px 18px 18px; color: #ffffff;
            font-family: 'Montserrat', sans-serif; font-size: clamp(1.1rem, 4vw, 1.2rem);
            outline: none; box-sizing: border-box; text-align: center; letter-spacing: 3px;
        }

        .paste-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; fill: rgba(255, 255, 255, 0.4); display: flex; align-items: center; padding: 8px;
        }

        /* Плашка гильдии */
        .guild-preview {
            display: none; background: rgba(15, 27, 42, 0.9); border: 1px solid var(--accent-blue);
            border-radius: 8px; margin-bottom: 15px; padding: 12px; align-items: center; text-align: left;
        }
        .guild-icon-box {
            width: 45px; height: 45px; background: #1a2a3a; border-radius: 6px;
            margin-right: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        .guild-icon-img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
        .guild-name-display { display: block; font-weight: 700; font-size: 0.9rem; color: var(--accent-blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }

        .submit-btn {
            position: relative; width: 100%; padding: 20px; font-family: 'Montserrat', sans-serif;
            font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; letter-spacing: 2px;
        }

        .submit-btn.active {
            background: linear-gradient(to top, var(--swgoh-green-bright) 0%, var(--swgoh-green-dark) 100%);
            border: 1px solid #45f53d; color: #ffffff; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Кнопка Share: не темнеет */
        .share-btn { 
            margin-top: 20px; background: var(--accent-blue); width: 100%; border: none; 
            padding: 15px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .share-btn:hover, .share-btn:active, .share-btn:focus { 
            background: var(--accent-blue) !important; filter: none !important; opacity: 1 !important; outline: none !important;
        }

        .glow-line {
            position: absolute; bottom: -1.5px; left: 50%; width: 70%; height: 3px;
            background: radial-gradient(circle, #ffffff 0%, #ffffff 20%, transparent 80%);
            transform: translateX(-50%); opacity: 0; filter: blur(0.5px);
        }
        .submit-btn.active:hover .glow-line { opacity: 1; }

        .tg-login { font-size: clamp(0.75rem, 3vw, 0.85rem); margin-top: 15px; }
        .tg-login a { color: var(--accent-blue); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    <p class="description">Введи свой <b>код союзника</b> для авторизации.</p>

    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11" inputmode="numeric">
        <div class="paste-icon" id="pasteBtn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/></svg>
        </div>
    </div>

    <div id="guildPreview" class="guild-preview">
        <div class="guild-icon-box">
            <img id="guildImg" class="guild-icon-img" src="" style="display:none;">
            <span id="guildEmoji">⏳</span>
        </div>
        <div class="guild-info-text">
            <span id="guildNameDisplay" class="guild-name-display">Поиск...</span>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn">Продолжить
        <div class="glow-line"></div>
    </button>

    <button class="share-btn" onclick="alert('Функция в разработке')">ПОДЕЛИТЬСЯ</button>

    <div class="tg-login">
        Есть аккаунт? <a href="#">Войти с Telegram</a>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const btn = document.getElementById('submitBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const guildPreview = document.getElementById('guildPreview');
    const guildImg = document.getElementById('guildImg');
    const guildEmoji = document.getElementById('guildEmoji');
    const guildNameDisplay = document.getElementById('guildNameDisplay');

    function formatValue(val) {
        let digits = val.replace(/\D/g, '').substring(0, 9);
        let formatted = "";
        for (let i = 0; i < digits.length; i++) {
            if (i > 0 && i % 3 === 0) formatted += "-";
            formatted += digits[i];
        }
        return formatted;
    }

    async function findGuild(code) {
        guildPreview.style.display = 'flex';
        guildNameDisplay.innerText = 'Поиск...';
        guildEmoji.innerText = '⏳';
        guildImg.style.display = 'none';
        
        const proxy = "https://corsproxy.io/?";

        try {
            const pResp = await fetch(`${proxy}https://swgoh.gg/api/player/${code}/`);
            if (!pResp.ok) throw new Error();
            const pData = await pResp.json();
            const gId = pData.data.guild_id;

            if (!gId) throw new Error();

            const gResp = await fetch(`${proxy}https://swgoh.gg/api/guild-profile/${gId}/`);
            const gData = await gResp.json();

            guildNameDisplay.innerText = gData.data.name;
            guildImg.src = "https://swgoh.gg/static/img/assets/tex.guild_avatar_mon_calamari_01.png";
            guildImg.style.display = 'block';
            guildEmoji.innerText = '';
            btn.classList.add('active');
        } catch (err) {
            guildNameDisplay.innerText = 'Гильдия не найдена';
            guildEmoji.innerText = '🤔';
            guildImg.style.display = 'none';
            btn.classList.remove('active');
        }
    }

    input.addEventListener('input', () => {
        input.value = formatValue(input.value);
        let pureDigits = input.value.replace(/\D/g, '');
        if (pureDigits.length === 9) {
            findGuild(pureDigits);
        } else {
            guildPreview.style.display = 'none';
            btn.classList.remove('active');
        }
    });

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            input.value = text;
            input.dispatchEvent(new Event('input'));
        } catch (err) {}
    });

    setTimeout(() => input.focus(), 300);
</script>
</body>
</html>
