<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWGOH Hub - Mobile</title>
    <style>
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: #050505; color: white; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .search-section { width: 100%; max-width: 360px; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; 
            background: #111; color: white; font-size: 18px; box-sizing: border-box; 
            text-align: center; outline: none;
        }
        button#main-btn { 
            width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: none; 
            background: #007bff; color: white; font-weight: bold; font-size: 16px;
        }

        /* Карточка игрока */
        #player-card { 
            display: none; width: 100%; max-width: 380px; 
            background: #111; border-radius: 24px; padding: 20px; 
            border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .header-info { text-align: center; position: relative; }
        .p-avatar { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 3px solid #edb219; background: #000;
        }
        .p-name { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; }
        .p-title { color: #888; font-size: 13px; margin-bottom: 15px; display: block; }

        /* Гильдия */
        .guild-card { 
            background: rgba(255,255,255,0.03); border-radius: 15px; 
            padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
        }
        .g-logo { width: 50px; height: 50px; }
        .g-name { color: #4db8ff; font-weight: bold; font-size: 18px; }

        /* Склад (Юниты) */
        .units-grid { margin-top: 20px; text-align: left; }
        .unit-row { 
            display: flex; align-items: center; gap: 10px; 
            background: #1a1a1a; padding: 10px; border-radius: 10px; margin-bottom: 8px;
        }
        .unit-img { width: 45px; height: 45px; border-radius: 5px; border: 1px solid #444; }
        .unit-info { flex-grow: 1; }
        .unit-name { font-size: 14px; font-weight: bold; display: block; }
        .unit-gm { font-size: 12px; color: #edb219; }
        .gear-badge { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 11px; float: right; }

        /* Кнопка Share (твое условие: не темнеет) */
        .share-btn { 
            background: #28a745 !important; width: 100%; padding: 15px; 
            border: none; border-radius: 12px; color: white; font-weight: bold; margin-top: 15px;
        }
        .share-btn:hover { background: #28a745 !important; opacity: 0.9; }

        #status { color: #edb219; font-size: 14px; margin: 10px; }
    </style>
</head>
<body>

    <div class="search-section">
        <input type="tel" id="allyCode" placeholder="Код союзника (9 цифр)" maxlength="9">
        <button id="main-btn" onclick="fetchPlayer()">ЗАГРУЗИТЬ ДАННЫЕ</button>
        <div id="status"></div>
    </div>

    <div id="player-card">
        <div class="header-info">
            <img id="p-avatar" class="p-avatar" src="">
            <div class="p-name" id="p-name"></div>
            <span class="p-title" id="p-title"></span>
            <div style="color:#edb219; font-weight:bold; margin-bottom:15px;" id="p-gm"></div>
        </div>

        <div class="guild-card">
            <img class="g-logo" src="https://game-assets.swgoh.gg/static/assets/textures/gui/guild/guild_logo_white.png">
            <div>
                <div class="g-name" id="g-name"></div>
                <div style="font-size:12px; color:#777;" id="g-role"></div>
            </div>
        </div>

        <div class="units-grid">
            <div style="font-size: 14px; color: #888; margin-bottom: 10px; text-transform: uppercase;">Топ юнитов склада:</div>
            <div id="units-container"></div>
        </div>

        <button class="share-btn">ПОДЕЛИТЬСЯ КАРТОЧКОЙ</button>
    </div>

    <script>
        async function fetchPlayer() {
            const code = document.getElementById('allyCode').value.replace(/\D/g, '');
            const card = document.getElementById('player-card');
            const status = document.getElementById('status');
            const unitsContainer = document.getElementById('units-container');

            if (code.length < 9) return alert('Введите 9 цифр');

            status.textContent = "⌛ Получение данных из Внешнего Кольца...";
            card.style.display = 'none';
            unitsContainer.innerHTML = '';

            // Используем corsproxy.io для работы на мобильных устройствах
            const url = `https://corsproxy.io/?${encodeURIComponent('https://swgoh.gg/api/player/' + code + '/')}`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                const p = result.data;

                // Основная инфа
                document.getElementById('p-avatar').src = `https://game-assets.swgoh.gg/tex.charui_portrait_${p.portrait_id}.png`;
                document.getElementById('p-name').textContent = p.name;
                document.getElementById('p-title').textContent = p.title || 'Ветеран Голонета';
                document.getElementById('p-gm').textContent = p.galactic_power.toLocaleString() + ' ГМ';
                
                // Гильдия
                document.getElementById('g-name').textContent = p.guild_name;
                document.getElementById('g-role').textContent = p.guild_member_level === 4 ? 'Лидер' : (p.guild_member_level === 3 ? 'Офицер' : 'Участник');

                // Склад (Берем топ-5 юнитов по ГМ из массива юнитов)
                // В твоем JSON юниты лежат в result.units
                const topUnits = result.units
                    .sort((a, b) => b.data.galactic_power - a.data.galactic_power)
                    .slice(0, 5);

                topUnits.forEach(u => {
                    const unitHtml = `
                        <div class="unit-row">
                            <img class="unit-img" src="https://game-assets.swgoh.gg/tex.charui_${u.data.base_id.toLowerCase()}.png" onerror="this.src='https://game-assets.swgoh.gg/tex.charui_jedi_consular.png'">
                            <div class="unit-info">
                                <span class="unit-name">${u.data.name}</span>
                                <span class="unit-gm">${u.data.galactic_power.toLocaleString()} ГМ</span>
                            </div>
                            <span class="gear-badge">G${u.data.gear_level}</span>
                        </div>
                    `;
                    unitsContainer.innerHTML += unitHtml;
                });

                card.style.display = 'block';
                status.textContent = "";

            } catch (e) {
                console.error(e);
                status.textContent = "❌ Ошибка загрузки. Проверьте код союзника.";
            }
        }
    </script>
</body>
</html>
