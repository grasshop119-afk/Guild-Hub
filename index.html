<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050b14;
            --accent-blue: #4facfe;
            --border: rgba(30, 58, 95, 0.8);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            background: var(--bg-dark); color: white;
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #050b14 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .main-content { width: 90%; max-width: 360px; text-align: center; }
        .logo { width: 200px; margin-bottom: 25px; }
        h1 { font-size: 1.3rem; text-transform: uppercase; margin-bottom: 10px; }
        
        /* Инпут */
        .input-wrapper { position: relative; margin-bottom: 15px; }
        .swgoh-input {
            width: 100%; background: rgba(5, 13, 22, 0.8); border: 1px solid var(--border);
            border-radius: 8px; padding: 18px; color: white; font-size: 1.2rem;
            text-align: center; letter-spacing: 2px; outline: none;
        }

        /* Плашка гильдии */
        #guildCard {
            display: none; background: rgba(30, 58, 95, 0.2); border: 1px solid var(--accent-blue);
            border-radius: 8px; padding: 12px; margin-top: 15px; align-items: center; text-align: left;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .guild-avatar {
            width: 45px; height: 45px; background: #1a2a3a; border-radius: 6px;
            margin-right: 12px; border: 1px solid rgba(255,255,255,0.1);
            background-size: cover; background-position: center;
        }
        .guild-info { display: flex; flex-direction: column; }
        .guild-name { font-weight: 700; color: var(--accent-blue); font-size: 0.95rem; }
        .player-name { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

<div class="main-content">
    <img src="https://i.ibb.co/v4x1hC8n/image.png" alt="Logo" class="logo">
    <h1>Добро пожаловать!</h1>
    
    <div class="input-wrapper">
        <input type="text" id="allyCode" class="swgoh-input" placeholder="000-000-000" maxlength="11">
    </div>

    <div id="guildCard">
        <div id="avatar" class="guild-avatar"></div>
        <div class="guild-info">
            <span id="gName" class="guild-name">Поиск...</span>
            <span id="pName" class="player-name">Загрузка данных</span>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('allyCode');
    const card = document.getElementById('guildCard');
    const gName = document.getElementById('gName');
    const pName = document.getElementById('pName');
    const avatar = document.getElementById('avatar');

    input.addEventListener('input', async (e) => {
        let val = e.target.value.replace(/\D/g, '');
        
        // Форматирование 000-000-000
        let formatted = "";
        for(let i=0; i<val.length && i<9; i++) {
            if(i>0 && i%3===0) formatted += "-";
            formatted += val[i];
        }
        input.value = formatted;

        if (val.length === 9) {
            card.style.display = 'flex';
            gName.innerText = "Ищу...";
            pName.innerText = "Связь с сервером";
            avatar.style.backgroundImage = "none";

            try {
                const res = await fetch(`/api/check/${val}`);
                if (!res.ok) throw new Error();
                const data = await res.json();

                gName.innerText = data.guildName;
                pName.innerText = `Игрок: ${data.name}`;
                avatar.style.backgroundImage = `url('https://game-assets.swgoh.gg/tex.gui_portraits_${data.portraitId}.png')`;
            } catch (err) {
                gName.innerText = "Ошибка";
                pName.innerText = "Код не найден";
            }
        } else {
            card.style.display = 'none';
        }
    });
</script>
</body>
</html>
