<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SWGoH Mini App</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #3390ec; color: white; border: none; border-radius: 5px; }
        
        /* Твоя кнопка Share - не темнеет при наведении (как просил) */
        .share-btn:hover { background: #3390ec !important; filter: none !important; }
        
        .member-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        .red { color: #ff4d4d; }
        .green { color: #4dff4d; }
    </style>
</head>
<body>

    <h2>Поиск гильдии</h2>
    <input type="text" id="allyCode" placeholder="Введи код союзника">
    <button onclick="findGuild()">Найти</button>

    <h3 id="guildName"></h3>

    <div id="energyTab" style="margin-top: 20px;">
        <div id="results"></div>
    </div>

    <button class="share-btn" style="margin-top: 20px;">Поделиться</button>

    <script>
        async function findGuild() {
            const code = document.getElementById('allyCode').value;
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "Ищем...";

            try {
                // Запрос к твоему серверу (замени localhost на адрес своего сервера позже)
                const response = await fetch(`http://localhost:3000/get_guild/${code}`);
                const data = await response.json();

                document.getElementById('guildName').innerText = "Гильдия: " + data.name;
                resDiv.innerHTML = "";

                data.members.forEach(m => {
                    const tickets = m.daily_raid_tickets || 0;
                    const colorClass = tickets < 600 ? 'red' : 'green';
                    
                    resDiv.innerHTML += `
                        <div class="member-row">
                            <span>${m.player_name}</span>
                            <span class="${colorClass}">${tickets}/600</span>
                        </div>`;
                });
            } catch (e) {
                resDiv.innerHTML = "Ошибка. Проверь код союзника.";
            }
        }
    </script>
</body>
</html>
